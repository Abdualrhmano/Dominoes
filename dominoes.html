<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dominoes — Luxury Skeuomorphic — Single File</title>

  <!-- Single-file: all styles and scripts inline (no external audio files) -->
  <style>
    /* -------------------------
       THEME VARIABLES
       ------------------------- */
    :root{
      --bg-1: #060607;
      --bg-2: #0b0f12;
      --felt-1: #0b2a1f;
      --felt-2: #072116;
      --wood-1: #0b0604;
      --muted: #9aa4b2;
      --accent: #ffd166;
      --accent-2: #7ef9ff;
      --tile-ivory: #fbf7ef;
      --tile-shadow: rgba(2,6,12,0.65);
      --pip-dark: #0b0b0b;
      --metal-gold-1: #d4af37;
      --metal-gold-2: #8b6b2f;
      --glass: rgba(255,255,255,0.03);
      --card-shadow: 0 30px 80px rgba(0,0,0,0.7);
      --ui-radius: 12px;
      --tile-w: 96px;
      --tile-h: 56px;
      --tile-gap: 12px;
    }

    /* -------------------------
       PAGE & BOARD (luxury felt + wood)
       ------------------------- */
    html,body,#app{ height:100%; margin:0; background: linear-gradient(180deg,var(--bg-1), var(--bg-2) 60%); color:#e6eef6; font-family:Inter, system-ui, "Noto Naskh Arabic", Arial; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }

    .app-wrap{ max-width:1280px; margin:28px auto; padding:22px; }

    .scoreboard{ display:flex; gap:14px; align-items:center; justify-content:space-between; padding:14px; border-radius:14px; background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid var(--glass); box-shadow: var(--card-shadow); }

    .score-card{ padding:12px 16px; border-radius:10px; background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00)); min-width:160px; text-align:center; border:1px solid rgba(255,255,255,0.02); }
    .score-card h4{ margin:0; color:var(--accent); font-weight:800; font-size:13px; }
    .score-card p{ margin:6px 0 0 0; font-weight:900; font-size:20px; color:#f6f7f8; }

    /* Board wrap: composite of walnut wood + felt inset */
    .board-wrap{
      margin-top:18px;
      border-radius:18px;
      padding:22px;
      position:relative;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.02);
      box-shadow: 0 30px 90px rgba(0,0,0,0.7);
      background:
        radial-gradient(1200px 300px at 10% 10%, rgba(255,255,255,0.02), transparent 6%),
        linear-gradient(180deg, #0b0705 0%, #0b0604 100%);
    }

    /* Decorative wood frame using pseudo element */
    .board-wrap::before{
      content:"";
      position:absolute;
      inset:10px;
      border-radius:14px;
      pointer-events:none;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.35), rgba(255,255,255,0.02)) ,
        repeating-linear-gradient(90deg, rgba(255,255,255,0.01) 0 1px, transparent 1px 6px);
      mix-blend-mode:overlay;
      box-shadow: inset 0 0 0 6px rgba(0,0,0,0.45);
    }

    /* Felt playing surface (center) */
    .felt{
      position:relative;
      margin:18px auto;
      border-radius:12px;
      padding:18px;
      min-height:220px;
      max-width:100%;
      background:
        radial-gradient(800px 200px at 50% 10%, rgba(255,255,255,0.02), transparent 10%),
        linear-gradient(180deg, #072116 0%, #0b2a1f 100%);
      box-shadow: inset 0 6px 30px rgba(0,0,0,0.6);
      border:1px solid rgba(255,255,255,0.02);
      overflow:hidden;
    }

    /* subtle felt grain using SVG data URI (small, performant) */
    .felt::after{
      content:"";
      position:absolute; inset:0; border-radius:12px; pointer-events:none;
      background-image:
        radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.01), transparent 10%),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><defs><filter id='n'><feTurbulence baseFrequency='0.8' numOctaves='1' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter></defs><rect width='100%' height='100%' filter='url(%23n)' opacity='0.02' fill='%23000000'/></svg>");
      mix-blend-mode:overlay;
      opacity:0.9;
    }

    /* -------------------------
       TRAIN (horizontal scroll) - hardware accelerated
       ------------------------- */
    .train{
      display:flex;
      gap:var(--tile-gap);
      align-items:center;
      padding:12px;
      overflow-x:auto;
      scroll-behavior:smooth;
      -webkit-overflow-scrolling:touch;
      transform: translateZ(0);
      will-change: transform;
    }

    /* -------------------------
       DOMINO TILE (skeuomorphic)
       ------------------------- */
    .domino{
      width:var(--tile-w);
      height:var(--tile-h);
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:8px;
      gap:8px;
      position:relative;
      transform-origin:center;
      transition: transform 220ms cubic-bezier(.2,.9,.3,1), box-shadow 180ms ease, filter 180ms ease;
      user-select:none;
      -webkit-user-select:none;
      cursor:grab;
      background: linear-gradient(180deg, #fffdf6 0%, #f6f1e6 40%, #efe7d6 100%);
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow:
        0 18px 40px rgba(2,6,12,0.6),
        0 6px 18px rgba(2,6,12,0.45),
        inset 0 2px 8px rgba(255,255,255,0.6),
        inset 0 -8px 18px rgba(0,0,0,0.06);
      color:var(--pip-dark);
      backface-visibility:hidden;
      perspective:1000px;
    }

    /* subtle bevel */
    .domino::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:10px;
      pointer-events:none;
      box-shadow: inset 0 2px 6px rgba(255,255,255,0.6), inset 0 -6px 12px rgba(0,0,0,0.06);
    }

    /* dark variant (used for UI/contrast) */
    .domino.dark{
      background: linear-gradient(180deg, #0f1720 0%, #0b1220 100%);
      color: #dfeaf0;
      border:1px solid rgba(255,255,255,0.03);
      box-shadow:
        0 22px 60px rgba(0,0,0,0.75),
        inset 0 2px 8px rgba(255,255,255,0.02),
        inset 0 -8px 18px rgba(0,0,0,0.25);
    }

    /* halves and divider */
    .half{ flex:1; display:flex; align-items:center; justify-content:center; gap:6px; position:relative; height:100%; }
    .divider{
      width:4px;
      height:80%;
      border-radius:4px;
      background: linear-gradient(180deg, rgba(0,0,0,0.12), rgba(255,255,255,0.06));
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
    }

    /* metallic stud in center (3D) */
    .divider .stud{
      width:10px;
      height:10px;
      border-radius:50%;
      background: radial-gradient(circle at 30% 25%, #fff9e6 0%, var(--metal-gold-1) 20%, var(--metal-gold-2) 60%, #3b2a12 100%);
      box-shadow:
        0 2px 6px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.6),
        inset 0 -2px 4px rgba(0,0,0,0.25);
      transform: translateZ(20px);
    }

    /* PIPS: engraved/inset look */
    .pip{
      width:10px;
      height:10px;
      border-radius:50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.6) 6%, rgba(0,0,0,0.05) 7%),
        radial-gradient(circle at 50% 60%, rgba(0,0,0,0.6), rgba(0,0,0,0.4) 40%, rgba(0,0,0,0.2) 60%),
        linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.12));
      box-shadow:
        inset 0 2px 6px rgba(255,255,255,0.08),
        inset 0 -6px 10px rgba(0,0,0,0.45),
        0 2px 6px rgba(0,0,0,0.25);
      transform: translateZ(-2px);
    }

    /* pips layout helpers */
    .pips-0 .pip{ display:none; }
    .pips-1{ justify-content:center; }
    .pips-2{ justify-content:space-between; }
    .pips-3{ justify-content:space-between; }
    .pips-4{ justify-content:space-between; flex-wrap:wrap; align-content:space-between; }
    .pips-5{ justify-content:space-between; flex-wrap:wrap; align-content:space-between; }
    .pips-6{ justify-content:space-between; flex-wrap:wrap; align-content:space-between; }

    /* playable highlight */
    .domino.playable{
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 30px 70px rgba(0,0,0,0.8), 0 0 24px rgba(126,249,255,0.04);
      outline: 2px solid rgba(126,249,255,0.06);
    }

    /* dragging state */
    .domino.dragging{
      transform: translateY(-22px) scale(1.08) rotate(-2deg);
      box-shadow: 0 40px 100px rgba(0,0,0,0.9);
      z-index:1200;
      cursor:grabbing;
    }

    /* hand area */
    .hand{ position:fixed; left:0; right:0; bottom:0; background: linear-gradient(180deg, rgba(2,6,12,0.6), rgba(2,6,12,0.85)); border-top:1px solid rgba(255,255,255,0.02); padding:14px 18px; display:flex; align-items:center; justify-content:center; gap:12px; z-index:40; }
    .hand-inner{ display:flex; gap:12px; align-items:center; justify-content:center; max-width:100%; overflow:auto; padding:6px; }

    /* hint dots */
    .placement-hint{ position:absolute; top:50%; left:12px; transform:translateY(-50%); display:flex; gap:8px; align-items:center; z-index:20; }
    .hint-dot{ width:12px; height:12px; border-radius:50%; background: linear-gradient(180deg,var(--accent-2), #3ee7ff); box-shadow: 0 6px 18px rgba(62,231,255,0.12), 0 2px 6px rgba(0,0,0,0.6); opacity:0; transform:scale(0.6); transition: all .28s cubic-bezier(.2,.9,.3,1); }
    .hint-dot.show{ opacity:1; transform:scale(1); }

    /* tooltip */
    .hint-tooltip{
      position:absolute; bottom:84px; left:50%; transform:translateX(-50%); background: rgba(10,14,20,0.92); border:1px solid rgba(255,255,255,0.04); padding:10px 14px; border-radius:10px; color:var(--muted); font-size:13px; z-index:60; box-shadow: 0 10px 30px rgba(0,0,0,0.6); opacity:0; transition: opacity .28s; pointer-events:none;
    }
    .hint-tooltip.show{ opacity:1; pointer-events:auto; }

    /* modal */
    .modal{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:80; background: linear-gradient(180deg, rgba(2,6,12,0.6), rgba(2,6,12,0.85)); backdrop-filter: blur(6px) saturate(120%); }
    .modal-card{ background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:14px; padding:22px; width: min(720px, 92%); box-shadow: 0 30px 80px rgba(0,0,0,0.7); border:1px solid rgba(255,255,255,0.03); text-align:center; }

    /* responsive */
    @media (max-width:640px){
      :root{ --tile-w:72px; --tile-h:44px; --tile-gap:8px; }
      .board-wrap{ padding:12px; }
      .hand{ padding:10px; }
    }
  </style>
</head>
<body>
  <div id="app" class="app-wrap">
    <div class="scoreboard" role="region" aria-label="Scoreboard">
      <div style="display:flex; gap:12px; align-items:center;">
        <div class="score-card">
          <h4>Player</h4>
          <p id="player-score">0</p>
          <div style="color:var(--muted); font-size:12px;">vs 101</div>
        </div>
        <div class="score-card">
          <h4>AI Opponent</h4>
          <p id="ai-score">0</p>
          <div style="color:var(--muted); font-size:12px;">vs 101</div>
        </div>
      </div>

      <div style="text-align:center;">
        <div style="color:var(--muted); font-size:13px;">Round</div>
        <div id="round-number" style="font-weight:800; font-size:18px">1</div>
      </div>

      <div style="display:flex; gap:12px; align-items:center;">
        <button id="reset-match" class="btn" title="Reset match" style="background:transparent; border:1px solid rgba(255,255,255,0.04); padding:8px 12px; border-radius:10px; color:var(--tile-ivory); font-weight:700; cursor:pointer;">Reset Match</button>
        <div style="text-align:right; color:var(--muted); font-size:13px;">
          <div id="turn-indicator">—</div>
          <div id="status-text" style="font-size:12px">Welcome to Dominoes</div>
        </div>
      </div>
    </div>

    <div class="board-wrap">
      <div class="felt" id="felt">
        <div class="placement-hint" id="placement-hint">
          <div class="hint-dot" id="hint-left"></div>
          <div class="hint-dot" id="hint-right"></div>
        </div>

        <div style="position:absolute; right:18px; top:18px; display:flex; gap:8px; align-items:center; z-index:30;">
          <div id="bone-stack" title="Boneyard — draw a tile" style="width:72px; height:44px; border-radius:8px; background: linear-gradient(180deg,#0b1220,#071018); border:1px solid rgba(255,255,255,0.03); box-shadow: 0 8px 20px rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; color:var(--muted); font-weight:700; font-size:13px; cursor:pointer; user-select:none;">Boneyard</div>
          <div id="boneyard-count" style="color:var(--muted); font-weight:700;">28</div>
        </div>

        <div id="train" class="train" aria-live="polite" aria-atomic="true"></div>

        <div style="position:absolute; left:18px; bottom:18px; color:var(--muted); font-size:13px; z-index:50; display:flex; gap:12px; align-items:center;">
          <div id="last-play" class="muted">No plays yet</div>
        </div>

        <div id="first-move-tooltip" class="hint-tooltip" aria-hidden="true"></div>
      </div>
    </div>

    <div class="hand" id="player-hand-area" aria-label="Player hand">
      <div class="hand-inner" id="player-hand"></div>
    </div>

    <div id="modal-root" style="display:none;"></div>
    <canvas id="confetti" style="position:fixed; inset:0; pointer-events:none; z-index:90; display:none;"></canvas>
  </div>

  <!-- Single-file JavaScript: game logic preserved, enhanced visuals & WebAudio synthesis -->
  <script>
  (function(){
    /* ============================
       DOM SHORTCUTS
       ============================ */
    const $ = (s,r=document)=> r.querySelector(s);
    const $$ = (s,r=document)=> Array.from(r.querySelectorAll(s));
    const trainEl = $('#train');
    const playerHandEl = $('#player-hand');
    const boneStackEl = $('#bone-stack');
    const boneyardCountEl = $('#boneyard-count');
    const roundNumberEl = $('#round-number');
    const playerScoreEl = $('#player-score');
    const aiScoreEl = $('#ai-score');
    const resetMatchBtn = $('#reset-match');
    const modalRoot = $('#modal-root');
    const turnIndicator = $('#turn-indicator');
    const statusText = $('#status-text');
    const lastPlay = $('#last-play');
    const placementHintLeft = $('#hint-left');
    const placementHintRight = $('#hint-right');
    const boardWrap = $('#felt');
    const firstMoveTooltip = $('#first-move-tooltip');
    const confettiCanvas = $('#confetti');

    /* ============================
       GAME CONSTANTS & STATE (unchanged core logic)
       ============================ */
    const TARGET_SCORE = 101;
    const PLAYER = 'player';
    const AI = 'ai';

    let deck = [];
    let boneyard = [];
    let hands = { player: [], ai: [] };
    let train = [];
    let currentTurn = null;
    let round = 1;
    let scores = { player:0, ai:0 };
    let roundStarter = null;
    let roundWinner = null;
    let animLock = false;

    // first-move highest double rule
    let highestDoubleTile = null;
    let highestDoubleOwner = null;
    let roundFirstMove = true;

    /* ============================
       UTILITIES
       ============================ */
    function buildDeck(){
      const arr=[];
      for(let i=0;i<=6;i++){
        for(let j=i;j<=6;j++){
          arr.push({a:i,b:j,id:`${i}-${j}`});
        }
      }
      return arr;
    }
    function shuffle(arr){
      for(let i=arr.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
      }
      return arr;
    }

    function deal(){
      hands.player=[]; hands.ai=[];
      for(let i=0;i<7;i++){
        hands.player.push(boneyard.pop());
        hands.ai.push(boneyard.pop());
      }
    }

    function determineStarter(){
      const all = [...hands.player.map(t=>({...t,owner:PLAYER})), ...hands.ai.map(t=>({...t,owner:AI}))];
      const doubles = all.filter(t=>t.a===t.b);
      if(doubles.length){
        doubles.sort((x,y)=> (y.a - x.a));
        return doubles[0].owner;
      }
      all.sort((x,y)=> ((y.a+y.b) - (x.a+x.b)));
      return all[0].owner;
    }

    function findHighestDouble(){
      const all = [...hands.player.map(t=>({...t,owner:PLAYER})), ...hands.ai.map(t=>({...t,owner:AI}))];
      const doubles = all.filter(t=>t.a===t.b);
      if(doubles.length===0) { highestDoubleTile = null; highestDoubleOwner = null; return; }
      doubles.sort((x,y)=> (y.a - x.a));
      highestDoubleTile = {a:doubles[0].a, b:doubles[0].b, id:doubles[0].id};
      highestDoubleOwner = doubles[0].owner;
    }

    /* ============================
       RENDERING: tiles & hand (preserve structure)
       ============================ */
    function renderTrain(){
      trainEl.innerHTML='';
      train.forEach((tile, idx)=>{
        const el = createTileElement(tile, false);
        el.classList.add('snap');
        el.style.transitionDelay = (idx*20)+'ms';
        trainEl.appendChild(el);
      });
      // hardware-accelerated hint: ensure transform only used
      requestAnimationFrame(()=>{ trainEl.style.transform = 'translateZ(0)'; });
    }

    function renderHand(){
      playerHandEl.innerHTML='';
      hands.player.forEach((tile, idx)=>{
        const el = createTileElement(tile, true);
        el.tabIndex = 0;
        el.dataset.index = idx;
        el.dataset.tileId = tile.id;
        if(isTilePlayable(tile, PLAYER)) el.classList.add('playable');
        playerHandEl.appendChild(el);
      });
      // rebind interactions & parallax
      bindHandInteractions();
    }

    function createTileElement(tile, isHand=false){
      const wrapper = document.createElement('div');
      wrapper.className = 'domino';
      wrapper.setAttribute('role','button');
      wrapper.setAttribute('aria-label', `Tile ${tile.a} and ${tile.b}`);
      if(tile.rot) wrapper.classList.add(`rot-${tile.rot}`); else wrapper.classList.add('rot-0');

      // left half
      const left = document.createElement('div'); left.className = 'half pips-'+tile.a;
      for(let i=0;i<getPipCount(tile.a);i++){ const p=document.createElement('div'); p.className='pip'; left.appendChild(p); }
      // divider with metallic stud
      const div = document.createElement('div'); div.className='divider';
      const stud = document.createElement('div'); stud.className='stud'; div.appendChild(stud);
      // right half
      const right = document.createElement('div'); right.className = 'half pips-'+tile.b;
      for(let i=0;i<getPipCount(tile.b);i++){ const p=document.createElement('div'); p.className='pip'; right.appendChild(p); }

      wrapper.appendChild(left); wrapper.appendChild(div); wrapper.appendChild(right);
      wrapper.style.transform = `perspective(800px) rotateX(2deg) rotateY(-1deg)`;

      if(isHand){
        wrapper.addEventListener('mouseenter', ()=> { wrapper.classList.add('hovering'); audioManager.play('clack', {gain:0.06}); });
        wrapper.addEventListener('mouseleave', ()=> { wrapper.classList.remove('hovering'); });
        wrapper.addEventListener('click', onPlayerTileClick);
        wrapper.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); onPlayerTileClick.call(wrapper,e); }});
      }
      return wrapper;
    }

    function getPipCount(n){ return n===0 ? 1 : n; }

    /* ============================
       GAME RULES: playable check (preserve highest-double rule)
       ============================ */
    function isTilePlayable(tile, who){
      if(train.length === 0 && roundFirstMove && highestDoubleTile){
        if(highestDoubleOwner === who){
          return tile.id === highestDoubleTile.id;
        } else {
          return false;
        }
      }
      if(train.length === 0) return true;
      const leftEnd = train[0].a;
      const rightEnd = train[train.length-1].b;
      return tile.a === leftEnd || tile.b === leftEnd || tile.a === rightEnd || tile.b === rightEnd;
    }

    function getPlayableTiles(hand){
      return hand.filter(t => isTilePlayable(t, hand === hands.player ? PLAYER : AI));
    }

    /* ============================
       PLAYER INTERACTIONS
       ============================ */
    function onPlayerTileClick(e){
      if(animLock) return;
      if(currentTurn !== PLAYER) return;
      const idx = parseInt(this.dataset.index,10);
      const tile = hands.player[idx];
      if(!isTilePlayable(tile, PLAYER)){
        if(train.length===0 && roundFirstMove && highestDoubleTile && highestDoubleOwner === PLAYER){
          showHintTooltip(`يجب عليك البدء بأعلى دبل لديك: ${highestDoubleTile.a}-${highestDoubleTile.b}`);
          audioManager.play('error', {gain:0.08});
          return;
        }
        flashStatus('Tile not playable. Draw from boneyard if needed.');
        audioManager.play('error', {gain:0.06});
        return;
      }
      showPlacementHints(tile);
      placePlayerTile(idx);
    }

    function showPlacementHints(tile){
      placementHintLeft.classList.remove('show');
      placementHintRight.classList.remove('show');
      if(train.length === 0){
        placementHintLeft.classList.add('show');
        placementHintRight.classList.add('show');
        return;
      }
      const leftEnd = train[0].a;
      const rightEnd = train[train.length-1].b;
      if(tile.a === leftEnd || tile.b === leftEnd) placementHintLeft.classList.add('show');
      if(tile.a === rightEnd || tile.b === rightEnd) placementHintRight.classList.add('show');
    }

    function placePlayerTile(handIndex){
      const tile = hands.player[handIndex];
      if(!isTilePlayable(tile, PLAYER)) return;
      let side = null;
      if(train.length === 0) side = 'right';
      else {
        const leftEnd = train[0].a;
        const rightEnd = train[train.length-1].b;
        const canLeft = (tile.a === leftEnd || tile.b === leftEnd);
        const canRight = (tile.a === rightEnd || tile.b === rightEnd);
        if(canRight && !canLeft) side = 'right';
        else if(canLeft && !canRight) side = 'left';
        else side = 'right';
      }
      performPlace(tile, handIndex, PLAYER, side);
    }

    /* ============================
       CORE: performPlace (preserve behavior)
       ============================ */
    function performPlace(tile, handIndex, who, side){
      animLock = true;
      if(who === PLAYER) hands.player.splice(handIndex,1);
      else {
        const idx = hands.ai.findIndex(t=>t.id===tile.id);
        if(idx>=0) hands.ai.splice(idx,1);
      }

      let placed = {...tile};
      placed.rot = (side === 'left') ? 270 : 90;

      if(side === 'left'){
        const leftEnd = train.length ? train[0].a : null;
        if(train.length && placed.b !== leftEnd) [placed.a,placed.b] = [placed.b,placed.a];
        train.unshift(placed);
      } else {
        const rightEnd = train.length ? train[train.length-1].b : null;
        if(train.length && placed.a !== rightEnd) [placed.a,placed.b] = [placed.b,placed.a];
        train.push(placed);
      }

      // After first placement, mark that first move has occurred
      if(roundFirstMove) roundFirstMove = false;

      // Visual & audio feedback
      renderTrain();
      renderHand();
      updateBoneyardCount();
      lastPlay.textContent = `${who === PLAYER ? 'Player' : 'AI'} played ${tile.a}-${tile.b}`;
      showPlacementHints({a:-1,b:-1});
      audioManager.play('clack', {gain:0.12, pitch: 1 + (tile.a+tile.b)/24});

      // subtle tile settle animation: scroll then unlock
      setTimeout(()=> {
        scrollTrainToEnd(side);
      }, 360);

      setTimeout(()=>{
        animLock = false;
        checkRoundEnd(who);
        if(!isRoundOver()){
          currentTurn = (who === PLAYER) ? AI : PLAYER;
          updateTurnIndicator();
          if(currentTurn === AI) setTimeout(aiTurn, 600);
        }
      }, 420);
    }

    /* ============================
       AI TURN (preserve logic)
       ============================ */
    function aiTurn(){
      if(animLock) return;
      if(train.length === 0 && roundFirstMove && highestDoubleTile && highestDoubleOwner === AI){
        const idx = hands.ai.findIndex(t=>t.id===highestDoubleTile.id);
        if(idx>=0){
          const chosen = hands.ai[idx];
          performPlace(chosen, null, AI, 'right');
          return;
        }
      }

      const playable = getPlayableTiles(hands.ai);
      if(playable.length === 0){
        if(boneyard.length > 0){
          drawFromBoneyard(AI);
          setTimeout(aiTurn, 450);
          return;
        } else {
          currentTurn = PLAYER;
          updateTurnIndicator();
          flashStatus('AI passes — no playable tiles');
          audioManager.play('error', {gain:0.05});
          return;
        }
      }

      playable.sort((x,y)=>{
        const xScore = (x.a===x.b?100:0) + (x.a+x.b);
        const yScore = (y.a===y.b?100:0) + (y.a+y.b);
        return yScore - xScore;
      });

      const chosen = playable[0];
      let side = 'right';
      if(train.length === 0) side = 'right';
      else {
        const leftEnd = train[0].a;
        const rightEnd = train[train.length-1].b;
        const canLeft = (chosen.a === leftEnd || chosen.b === leftEnd);
        const canRight = (chosen.a === rightEnd || chosen.b === rightEnd);
        if(canRight && !canLeft) side = 'right';
        else if(canLeft && !canRight) side = 'left';
        else side = 'right';
      }

      performPlace(chosen, null, AI, side);
    }

    /* ============================
       DRAW FROM BONEYARD
       ============================ */
    function drawFromBoneyard(who){
      if(boneyard.length === 0) return null;
      const tile = boneyard.pop();
      if(who === PLAYER){ hands.player.push(tile); renderHand(); }
      else hands.ai.push(tile);
      updateBoneyardCount();
      flashStatus(`${who === PLAYER ? 'You' : 'AI'} drew a tile`);
      audioManager.play('slide', {gain:0.08});
      return tile;
    }

    function updateBoneyardCount(){ boneyardCountEl.textContent = boneyard.length; }

    /* ============================
       ROUND END & SCORING (preserve)
       ============================ */
    function checkRoundEnd(lastMover){
      if(hands.player.length === 0 || hands.ai.length === 0){
        const winner = hands.player.length === 0 ? PLAYER : AI;
        roundWinner = winner;
        const loser = winner === PLAYER ? AI : PLAYER;
        const points = sumPips(hands[loser]);
        scores[winner] += points;
        showRoundModal(winner, points, `${winner === PLAYER ? 'You' : 'AI'} emptied hand`);
        return;
      }

      const playerPlayable = getPlayableTiles(hands.player).length > 0;
      const aiPlayable = getPlayableTiles(hands.ai).length > 0;
      if(!playerPlayable && !aiPlayable && boneyard.length === 0){
        const playerPips = sumPips(hands.player);
        const aiPips = sumPips(hands.ai);
        let winner, points;
        if(playerPips < aiPips){ winner = PLAYER; points = aiPips - playerPips; }
        else if(aiPips < playerPips){ winner = AI; points = playerPips - aiPips; }
        else { winner = null; points = 0; }
        if(winner){ scores[winner] += points; roundWinner = winner; showRoundModal(winner, points, `Blocked game — ${winner === PLAYER ? 'You' : 'AI'} had lower pips`); }
        else { roundWinner = null; showRoundModal(null, 0, 'Blocked game — tie, no points awarded'); }
        return;
      }
    }

    function sumPips(hand){ return hand.reduce((s,t)=> s + t.a + t.b, 0); }

    /* ============================
       MODALS & VICTORY
       ============================ */
    function showRoundModal(winner, points, message){
      animLock = true;

    function isRoundOver(){
      return (hands.player.length === 0 || hands.ai.length === 0 || (!getPlayableTiles(hands.player).length && !getPlayableTiles(hands.ai).length && boneyard.length === 0));
    }

    function startRound(isInitial=false, prevWinner=null){
      deck = buildDeck(); shuffle(deck); boneyard = [...deck]; train = []; hands.player=[]; hands.ai=[];
      deal(); updateBoneyardCount();

      }

    /* ============================
       CONFETTI (canvas) - lightweight
       ============================ */
    let confettiCtx=null, confettiPieces=[], confettiAnim=null;
    function startConfetti(){
      confettiCanvas.style.display='block';
      confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight;
      confettiCtx = confettiCanvas.getContext('2d'); confettiPieces=[];
      const colors = ['#ffd166','#7ef9ff','#ff7ab6','#9bffb8','#ffd1a9'];
      for(let i=0;i<120;i++){
        confettiPieces.push({ x: Math.random()*confettiCanvas.width, y: Math.random()*confettiCanvas.height - confettiCanvas.height, w: 6 + Math.random()*10, h: 6 + Math.random()*10, vx: -2 + Math.random()*4, vy: 2 + Math.random()*6, r: Math.random()*360, vr: -6 + Math.random()*12, color: colors[Math.floor(Math.random()*colors.length)], opacity: 0.8 + Math.random()*0.2 });
      }
      (function loop(){ confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); confettiPieces.forEach(p=>{ p.x += p.vx; p.y += p.vy; p.r += p.vr; confettiCtx.save(); confettiCtx.translate(p.x,p.y); confettiCtx.rotate(p.r * Math.PI/180); confettiCtx.fillStyle = p.color; confettiCtx.globalAlpha = p.opacity; confettiCtx.fillRect(-p.w/2, -p.h/2, p.w, p.h); confettiCtx.restore(); if(p.y > confettiCanvas.height + 40){ p.y = -40; p.x = Math.random()*confettiCanvas.width; } }); confettiAnim = requestAnimationFrame(loop); })();
      setTimeout(stopConfetti, 6000);
    }
    function stopConfetti(){ if(confettiAnim) cancelAnimationFrame(confettiAnim); confettiCanvas.style.display='none'; }

    /* ============================
       SCROLL TRAIN

      try{

    /* ============================
       OBSERVER: update playable highlights & auto-pass

    function flashLastPlay(msg){ lastPlay.textContent = msg; setTimeout(()=> lastPlay.textContent = '—', 2200); }

    /* ============================
       INIT MATCH
       ============================ */
    function initMatch(){
      scores = { player:0, ai:0 }; round = 1; roundStarter = null; roundWinner = null; updateScoreboard(); startRound(true);
    }

    /* ============================
       EXPOSED DEBUG & MOD API

    window.__dominoes = {
      getState: () => ({

        hands,
        boneyard,
        train,

    };

    // Expose placeTileFromMod for external drag module (if used)
    window.placeTileFromMod = function(handIndex, side){
      try{
        if(typeof performPlace !== 'function') return;

          } else {
            flashStatus('Tile not playable. Draw from boneyard if needed.');
          }
          return;
        }
        performPlace(tile, handIndex, PLAYER, side === 'left' ? 'left' : 'right');

    };

    /* ============================
       RESIZE HANDLING
       ============================ */
    window.addEventListener('resize', ()=>{ if(confettiCanvas.style.display !== 'none'){ confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight; } });

    /* ============================
       PARALLAX / TILT EFFECT FOR HAND TILES
       ============================ */
    function bindHandInteractions(){
      // attach pointer events for parallax tilt and drag hint
      const tiles = Array.from(document.querySelectorAll('#player-hand .domino'));
      tiles.forEach((tile)=>{
        // remove previous listeners to avoid duplicates
        tile.onpointermove = null;
        tile.onpointerdown = null;
        tile.onpointerup = null;
        tile.onpointerleave = null;

        tile.onpointermove = (e)=>{
          const rect = tile.getBoundingClientRect();
          const cx = rect.left + rect.width/2;
          const cy = rect.top + rect.height/2;
          const dx = (e.clientX - cx) / rect.width;
          const dy = (e.clientY - cy) / rect.height;
          const rx = dy * 6; // rotateX
          const ry = -dx * 8; // rotateY
          tile.style.transform = `perspective(800px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(8px)`;
        };
        tile.onpointerleave = ()=>{
          tile.style.transform = `perspective(800px) rotateX(2deg) rotateY(-1deg)`;
        };
        // pointerdown visual
        tile.onpointerdown = (e)=>{
          tile.classList.add('dragging');
          // small clack on pick
          audioManager.play('clack', {gain:0.06});
        };
        tile.onpointerup = (e)=>{
          tile.classList.remove('dragging');
        };
      });
    }

    /* ============================
       AUDIO: Procedural WebAudio Synthesis Manager
       - self-contained, no external files
       - provides clack, slide, shuffle, fanfare, error
       ============================ */
    const audioManager = (function(){
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      const activeNodes = new Set();
      function now(){ return ctx.currentTime; }

      function playClack(opts = {}){
        const gain = opts.gain ?? 0.12;
        const pitch = opts.pitch ?? 1.0;
        // two short detuned oscillators + noise burst filtered
        const o1 = ctx.createOscillator(); o1.type = 'triangle'; o1.frequency.value = 120 * pitch;
        const o2 = ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = 180 * pitch;
        const g = ctx.createGain(); g.gain.value = 0.0001;
        const hpf = ctx.createBiquadFilter(); hpf.type = 'highpass'; hpf.frequency.value = 800;
        const lpf = ctx.createBiquadFilter(); lpf.type = 'lowpass'; lpf.frequency.value = 6000;

        o1.connect(g); o2.connect(g);
        g.connect(hpf); hpf.connect(lpf); lpf.connect(master);

        const t = now();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(gain, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);

        o1.start(t); o2.start(t);
        o1.stop(t + 0.22); o2.stop(t + 0.22);

        // short filtered noise for crispness
        const bufferSize = 2 * ctx.sampleRate;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = (Math.random()*2-1) * Math.exp(-i/(ctx.sampleRate*0.02));
        const noise = ctx.createBufferSource(); noise.buffer = noiseBuffer;
        const ng = ctx.createGain(); ng.gain.value = gain * 0.6;
        const nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 3000;
        noise.connect(nf); nf.connect(ng); ng.connect(master);
        noise.start(t); noise.stop(t + 0.12);

        // cleanup
        setTimeout(()=>{ try{ o1.disconnect(); o2.disconnect(); g.disconnect(); hpf.disconnect(); lpf.disconnect(); noise.disconnect(); ng.disconnect(); nf.disconnect(); }catch(e){} }, 500);
      }

      function playSlide(opts = {}){
        const gain = opts.gain ?? 0.08;
        const t = now();
        const noise = ctx.createBufferSource();
        const len = ctx.sampleRate * 1.2;
        const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for(let i=0;i<len;i++){
          data[i] = (Math.random()*2-1) * (1 - i/len) * 0.6;
        }
        noise.buffer = buffer;
        const g = ctx.createGain(); g.gain.value = 0.0001;
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1200;
        noise.connect(bp); bp.connect(g); g.connect(master);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(gain, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
        noise.start(t); noise.stop(t + 1.0);
        setTimeout(()=>{ try{ noise.disconnect(); g.disconnect(); bp.disconnect(); }catch(e){} }, 1200);
      }

      // shuffle ambience: rhythmic clack loop (returns id)
      let shuffleInterval = null;
      function startShuffle(opts = {}) {
        const gain = opts.gain ?? 0.06;
        if(shuffleInterval) return;
        // schedule periodic clacks using setInterval (lightweight)
        shuffleInterval = setInterval(()=>{ playClack({gain: gain, pitch: 0.9 + Math.random()*0.2}); }, 140);
      }
      function stopShuffle(){
        if(shuffleInterval){ clearInterval(shuffleInterval); shuffleInterval = null; }
      }

      function playFanfare(opts = {}){
        const gain = opts.gain ?? 0.18;
        const t = now() + 0.02;
        const notes = [880, 1100, 1320, 1760]; // harmonic ascending
        notes.forEach((freq, i)=>{
          const o = ctx.createOscillator(); o.type = 'sine';
          const g = ctx.createGain(); g.gain.value = 0.0001;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 6000;
          o.frequency.setValueAtTime(freq, t + i*0.08);
          o.connect(f); f.connect(g); g.connect(master);
          g.gain.setValueAtTime(0.0001, t + i*0.08);
          g.gain.exponentialRampToValueAtTime(gain * (1 - i*0.12), t + i*0.08 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + i*0.08 + 1.2);
          o.start(t + i*0.08); o.stop(t + i*0.08 + 1.2);
        });
        // bright bell overlay
        const bell = ctx.createOscillator(); bell.type = 'triangle'; bell.frequency.value = 1760;
        const bg = ctx.createGain(); bg.gain.value = 0.0001;
        const bf = ctx.createBiquadFilter(); bf.type = 'highpass'; bf.frequency.value = 800;
        bell.connect(bf); bf.connect(bg); bg.connect(master);
        bg.gain.setValueAtTime(0.0001, t);
        bg.gain.exponentialRampToValueAtTime(gain*0.6, t + 0.02);
        bg.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
        bell.start(t); bell.stop(t + 1.6);
      }

      function playError(opts = {}){ playClack({gain: opts.gain ?? 0.06, pitch: 0.6}); }

      // public API
      return {
        play(name, opts = {}){
          // resume context on first user gesture if suspended
          if(ctx.state === 'suspended'){ ctx.resume().catch(()=>{}); }
          if(name === 'clack') playClack(opts);
          else if(name === 'slide') playSlide(opts);
          else if(name === 'shuffle') startShuffle(opts);
          else if(name === 'fanfare') playFanfare(opts);
          else if(name === 'error') playError(opts);
        },
        stop(name){
          if(name === 'shuffle') stopShuffle();
        },
        setMasterVolume(v){ master.gain.value = Math.max(0, Math.min(1, v)); }
      };
    })();

    /* ============================
       DRAG & DROP (simple, integrated)
       - uses pointer events, calls placeTileFromMod
       ============================ */
    (function initDragDrop(){
      let draggingEl = null;
      let originIndex = null;
      const trainRect = ()=> trainEl.getBoundingClientRect();

      function pointerDown(e){
        const el = e.currentTarget;
        originIndex = parseInt(el.dataset.index,10);
        // only allow drag if player's turn and not animLock
        const s = window.__dominoes.getState();
        if(s.currentTurn !== 'player' || s.animLock) return;
        draggingEl = el.cloneNode(true);
        draggingEl.classList.add('dragging');
        draggingEl.style.position = 'fixed';
        draggingEl.style.left = (e.clientX - draggingEl.offsetWidth/2) + 'px';
        draggingEl.style.top = (e.clientY - draggingEl.offsetHeight/2) + 'px';
        document.body.appendChild(draggingEl);
        document.addEventListener('pointermove', pointerMove);
        document.addEventListener('pointerup', pointerUp, { once:true });
        e.preventDefault();
      }

      function pointerMove(e){
        if(!draggingEl) return;
        draggingEl.style.left = (e.clientX - draggingEl.offsetWidth/2) + 'px';
        draggingEl.style.top = (e.clientY - draggingEl.offsetHeight/2) + 'px';
        const rect = trainRect();
        if(e.clientX < rect.left + rect.width * 0.33) trainEl.dataset.dropSide = 'left';
        else if(e.clientX > rect.left + rect.width * 0.66) trainEl.dataset.dropSide = 'right';
        else trainEl.dataset.dropSide = 'middle';
      }

      function pointerUp(e){
        if(!draggingEl) return;
        const rect = trainRect();
        let side = 'right';
        if(e.clientX < rect.left + rect.width * 0.33) side = 'left';
        else if(e.clientX > rect.left + rect.width * 0.66) side = 'right';
        draggingEl.remove();
        draggingEl = null;
        trainEl.dataset.dropSide = '';
        document.removeEventListener('pointermove', pointerMove);
        // call exposed API
        window.placeTileFromMod(originIndex, side);
      }

      // attach to hand tiles after render
      const handObserver = new MutationObserver(()=> {
        const tiles = Array.from(document.querySelectorAll('#player-hand .domino'));
        tiles.forEach(t=>{
          t.removeEventListener('pointerdown', pointerDown);
          t.addEventListener('pointerdown', pointerDown);
          t.setAttribute('draggable', 'false');
        });
      });
      handObserver.observe(playerHandEl, { childList:true, subtree:true });
    })();

    /* ============================
       INITIALIZE
       ============================ */
    initMatch();

    // expose audio manager for debugging
    window.__audio = audioManager;

  })();
  </script>
