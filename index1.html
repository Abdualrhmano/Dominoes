<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominoes - Polished Edition</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --surface-light: #1a2740;
            --gold: #d4a574;
            --gold-light: #e8c9a0;
            --text: #e0d5c1;
            --text-dim: #a09080;
            --accent: #e8b44f;
            --accent-glow: #f0c870;
            --danger: #c0392b;
            --player-color: #4da6ff;
            --ai-color: #e85d75;
            --highlight: #5dfc8e;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
            --tile-bg: #f5efe0;
            --tile-border: #c4a882;
            --tile-pip: #2c1810;
            --tile-divider: #b8956e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 50% 30%, #1e2a3a 0%, #0d1117 100%);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            padding: 0;
            margin: 0;
        }

        /* ── HEADER / TOPBAR ── */
        .header {
            width: 100%;
            max-width: 900px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            gap: 16px;
            flex-shrink: 0;
            z-index: 10;
        }
        .header .score-block {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 10px 18px;
            box-shadow: var(--shadow);
            min-width: 100px;
            transition: box-shadow 0.4s, border-color 0.4s;
        }
        .header .score-block.player-block {
            border-left: 3px solid var(--player-color);
        }
        .header .score-block.ai-block {
            border-right: 3px solid var(--ai-color);
        }
        .header .score-block .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            font-weight: 600;
        }
        .header .score-block .score {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            transition: color 0.5s, transform 0.3s;
        }
        .header .score-block .score.flash {
            color: var(--accent-glow);
            transform: scale(1.2);
            animation: scoreFlash 0.6s ease-out;
        }
        @keyframes scoreFlash {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.35);
            }
        }

        .header .center-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }
        #turnIndicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
            white-space: nowrap;
            transition: color 0.3s;
        }
        #turnIndicator .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            animation: pulseDot 1.6s ease-in-out infinite;
            box-shadow: 0 0 12px currentColor;
        }
        #turnIndicator.player-turn .dot {
            background: var(--player-color);
            color: var(--player-color);
        }
        #turnIndicator.ai-turn .dot {
            background: var(--ai-color);
            color: var(--ai-color);
        }
        @keyframes pulseDot {
            0%,
            100% {
                box-shadow: 0 0 8px currentColor;
            }
            50% {
                box-shadow: 0 0 22px currentColor, 0 0 40px currentColor;
            }
        }
        #statusText {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: 500;
            text-align: center;
            transition: color 0.4s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        #statusText.highlight {
            color: var(--accent);
            font-weight: 600;
        }

        /* ── CANVAS AREA ── */
        .canvas-container {
            flex: 1;
            width: 100%;
            max-width: 900px;
            min-height: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }
        canvas {
            display: block;
            border-radius: 18px;
            background: var(--surface);
            box-shadow: inset 0 2px 20px rgba(0, 0, 0, 0.4), var(--shadow);
            cursor: default;
            max-width: 100%;
            max-height: 100%;
            transition: box-shadow 0.5s;
        }
        canvas.drop-zone-active {
            box-shadow: inset 0 2px 20px rgba(0, 0, 0, 0.4), 0 0 40px rgba(93, 252, 142, 0.25);
        }

        /* ── PLAYER HAND ── */
        .player-hand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px 16px;
            flex-shrink: 0;
            flex-wrap: wrap;
            max-width: 100%;
            z-index: 10;
        }
        .domino-tile {
            width: 56px;
            height: 100px;
            background: var(--tile-bg);
            background-image: linear-gradient(160deg, #faf5ea 0%, #efe4d0 100%);
            border: 2px solid var(--tile-border);
            border-radius: 8px;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s cubic-bezier(0.22, 0.61, 0.36, 1),
                box-shadow 0.2s, border-color 0.3s;
            will-change: transform;
            touch-action: none;
        }
        .domino-tile:hover {
            transform: translateY(-6px) scale(1.04);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45), 0 2px 4px rgba(0, 0, 0, 0.25);
            border-color: var(--gold-light);
            z-index: 20;
        }
        .domino-tile:active {
            cursor: grabbing;
        }
        .domino-tile.dragging {
            opacity: 0.5;
            transform: scale(0.9);
            pointer-events: none;
        }
        .domino-tile .tile-half {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--tile-pip);
            width: 100%;
            position: relative;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        .domino-tile .tile-divider {
            width: 80%;
            height: 2px;
            background: var(--tile-divider);
            border-radius: 1px;
            flex-shrink: 0;
        }
        .domino-tile.playable {
            border-color: var(--highlight);
            animation: playableGlow 2s ease-in-out infinite;
        }
        @keyframes playableGlow {
            0%,
            100% {
                box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35), 0 0 8px rgba(93, 252, 142, 0.3);
            }
            50% {
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35), 0 0 20px rgba(93, 252, 142, 0.55);
            }
        }

        /* ── GHOST TILE ── */
        .ghost-tile {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            width: 50px;
            height: 88px;
            background: var(--tile-bg);
            border: 2px dashed var(--accent);
            border-radius: 8px;
            opacity: 0.85;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            transform: translate(-50%, -50%) rotate(-3deg);
            transition: opacity 0.15s;
        }
        .ghost-tile .tile-half {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--tile-pip);
            width: 100%;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        .ghost-tile .tile-divider {
            width: 75%;
            height: 1.5px;
            background: var(--tile-divider);
            flex-shrink: 0;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 600px) {
            .header {
                padding: 8px 10px;
                gap: 8px;
            }
            .header .score-block {
                padding: 6px 12px;
                border-radius: 10px;
                min-width: 70px;
            }
            .header .score-block .score {
                font-size: 1.2rem;
            }
            .header .score-block .label {
                font-size: 0.6rem;
            }
            #turnIndicator {
                font-size: 0.78rem;
                gap: 4px;
            }
            #statusText {
                font-size: 0.65rem;
            }
            .domino-tile {
                width: 40px;
                height: 72px;
                border-radius: 6px;
            }
            .domino-tile .tile-half {
                font-size: 1rem;
            }
            .player-hand {
                gap: 3px;
                padding: 6px 8px 12px;
            }
            .ghost-tile {
                width: 38px;
                height: 66px;
            }
        }
    </style>
</head>
<body>

    <!-- ── HEADER ── -->
    <div class="header">
        <div class="score-block player-block">
            <span class="label">You</span>
            <span class="score" id="playerScore">0</span>
        </div>
        <div class="center-info">
            <div id="turnIndicator" class="player-turn">
                <span class="dot"></span> <span id="turnLabel">Your Turn</span>
            </div>
            <div id="statusText">Drag a tile to the board</div>
        </div>
        <div class="score-block ai-block">
            <span class="label">AI</span>
            <span class="score" id="aiScore">0</span>
        </div>
    </div>

    <!-- ── CANVAS ── -->
    <div class="canvas-container" id="canvasContainer">
        <canvas id="boardCanvas"></canvas>
    </div>

    <!-- ── PLAYER HAND ── -->
    <div class="player-hand" id="playerHand"></div>

    <!-- ── GHOST TILE (for drag) ── -->
    <div class="ghost-tile" id="ghostTile" style="display:none;">
        <div class="tile-half" id="ghostTop">0</div>
        <div class="tile-divider"></div>
        <div class="tile-half" id="ghostBottom">0</div>
    </div>

    <script>
        (function() {
            // ──────────────────────────────────────────────
            // CONSTANTS & CONFIG
            // ──────────────────────────────────────────────
            const TILE_WIDTH = 76;
            const TILE_HEIGHT = 40;
            const TILE_GAP = 3;
            const TILE_RADIUS = 6;
            const MAX_SCALE = 1.15;
            const MIN_SCALE = 0.35;
            const PADDING = 60;
            const TARGET_SCORE = 100;
            const LERP_SPEED = 0.14;
            const ANIMATION_DURATION = 380; // ms for tile settle animation
            const AI_THINK_DELAY = 600; // ms before AI plays

            // ──────────────────────────────────────────────
            // DOM REFERENCES
            // ──────────────────────────────────────────────
            const canvas = document.getElementById('boardCanvas');
            const ctx = canvas.getContext('2d');
            const canvasContainer = document.getElementById('canvasContainer');
            const playerHandEl = document.getElementById('playerHand');
            const ghostTileEl = document.getElementById('ghostTile');
            const ghostTopEl = document.getElementById('ghostTop');
            const ghostBottomEl = document.getElementById('ghostBottom');
            const turnIndicator = document.getElementById('turnIndicator');
            const turnLabel = document.getElementById('turnLabel');
            const statusText = document.getElementById('statusText');
            const playerScoreEl = document.getElementById('playerScore');
            const aiScoreEl = document.getElementById('aiScore');

            // ──────────────────────────────────────────────
            // GAME STATE (Engine)
            // ──────────────────────────────────────────────
            const state = {
                allTiles: [], // Master set of 28 tiles (objects with id, top, bottom)
                boneyard: [], // Remaining draw pile
                playerHand: [], // Array of tile objects
                aiHand: [], // Array of tile objects
                train: [], // Array of { tile, leftNum, rightNum }  (left-to-right order)
                trainLeftNum: null, // The open number on the far left
                trainRightNum: null, // The open number on the far right
                currentTurn: 'player', // 'player' | 'ai'
                playerScore: 0,
                aiScore: 0,
                roundOver: false,
                gameOver: false,
                winner: null,
                firstMove: true,
                consecutivePasses: 0,
                roundNumber: 1,
            };

            // ──────────────────────────────────────────────
            // ANIMATION STATE
            // ──────────────────────────────────────────────
            const animState = {
                targetScale: MAX_SCALE,
                currentScale: MAX_SCALE,
                targetOffsetX: 0,
                currentOffsetX: 0,
                targetOffsetY: 0,
                currentOffsetY: 0,
                settlingTiles: [], // { tile data, startX, startY, targetX, targetY, startTime, duration }
                particles: [],
                dropZoneHighlight: null, // 'left' | 'right' | null
                highlightAlpha: 0,
                targetHighlightAlpha: 0,
                scoreFlashPlayer: false,
                scoreFlashAI: false,
                scoreFlashStart: 0,
            };

            // ──────────────────────────────────────────────
            // DRAG STATE
            // ──────────────────────────────────────────────
            const dragState = {
                active: false,
                tile: null,
                tileIndex: -1,
                startX: 0,
                startY: 0,
                currentX: 0,
                currentY: 0,
                origRect: null,
            };

            // ──────────────────────────────────────────────
            // HELPER: Create full domino set (double-6)
            // ──────────────────────────────────────────────
            function createFullSet() {
                const tiles = [];
                let id = 0;
                for (let top = 0; top <= 6; top++) {
                    for (let bottom = top; bottom <= 6; bottom++) {
                        tiles.push({ id, top, bottom });
                        id++;
                    }
                }
                return tiles;
            }

            // ──────────────────────────────────────────────
            // HELPER: Shuffle array (Fisher-Yates)
            // ──────────────────────────────────────────────
            function shuffle(arr) {
                const a = [...arr];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            // ──────────────────────────────────────────────
            // HELPER: Get all unique numbers on a tile
            // ──────────────────────────────────────────────
            function tileNumbers(tile) {
                return [tile.top, tile.bottom];
            }

            // ──────────────────────────────────────────────
            // HELPER: Check if tile can match a number
            // ──────────────────────────────────────────────
            function tileMatches(tile, num) {
                return tile.top === num || tile.bottom === num;
            }

            // ──────────────────────────────────────────────
            // HELPER: Get the other number on a tile
            // ──────────────────────────────────────────────
            function otherNum(tile, matchedNum) {
                return tile.top === matchedNum ? tile.bottom : tile.top;
            }

            // ──────────────────────────────────────────────
            // HELPER: Tile pip sum
            // ──────────────────────────────────────────────
            function tileSum(tile) {
                return tile.top + tile.bottom;
            }

            // ──────────────────────────────────────────────
            // GAME: Initialize / reset round
            // ──────────────────────────────────────────────
            function initRound() {
                const fullSet = createFullSet();
                const shuffled = shuffle(fullSet);
                state.playerHand = shuffled.slice(0, 7);
                state.aiHand = shuffled.slice(7, 14);
                state.boneyard = shuffled.slice(14);
                state.train = [];
                state.trainLeftNum = null;
                state.trainRightNum = null;
                state.roundOver = false;
                state.firstMove = true;
                state.consecutivePasses = 0;
                state.winner = null;
                animState.settlingTiles = [];
                animState.particles = [];
                animState.dropZoneHighlight = null;
                animState.highlightAlpha = 0;
                animState.targetHighlightAlpha = 0;
                animState.targetScale = MAX_SCALE;
                animState.currentScale = MAX_SCALE;
                animState.targetOffsetX = 0;
                animState.currentOffsetX = 0;
                animState.targetOffsetY = 0;
                animState.currentOffsetY = 0;
                dragState.active = false;
                dragState.tile = null;
                ghostTileEl.style.display = 'none';

                // Determine first player: highest double, or alternate
                const playerDoubles = state.playerHand.filter(t => t.top === t.bottom).sort((a, b) =>
                    b.top - a.top);
                const aiDoubles = state.aiHand.filter(t => t.top === t.bottom).sort((a, b) => b.top - a.top);
                const playerBest = playerDoubles.length > 0 ? playerDoubles[0].top : -1;
                const aiBest = aiDoubles.length > 0 ? aiDoubles[0].top : -1;

                if (playerBest > aiBest) {
                    state.currentTurn = 'player';
                } else if (aiBest > playerBest) {
                    state.currentTurn = 'ai';
                } else {
                    // Alternate based on round
                    state.currentTurn = state.roundNumber % 2 === 1 ? 'player' : 'ai';
                }

                updateUI();
                renderBoard();

                if (state.currentTurn === 'ai') {
                    scheduleAIMove();
                }
            }

            // ──────────────────────────────────────────────
            // GAME: Find playable tiles for a hand
            // ──────────────────────────────────────────────
            function getPlayableTiles(hand) {
                if (state.firstMove) return [...hand]; // Any tile can be played first
                const playable = [];
                for (const tile of hand) {
                    const canLeft = tileMatches(tile, state.trainLeftNum);
                    const canRight = tileMatches(tile, state.trainRightNum);
                    if (canLeft || canRight) {
                        playable.push({
                            tile,
                            canLeft,
                            canRight,
                        });
                    }
                }
                return playable;
            }

            // ──────────────────────────────────────────────
            // GAME: Place a tile on the train
            // ──────────────────────────────────────────────
            function placeTile(tile, side) {
                // side: 'left' or 'right'
                if (state.firstMove) {
                    // First tile of the round
                    state.train.push({
                        tile,
                        leftNum: tile.top,
                        rightNum: tile.bottom,
                    });
                    state.trainLeftNum = tile.top;
                    state.trainRightNum = tile.bottom;
                    state.firstMove = false;
                } else if (side === 'left') {
                    const matchNum = state.trainLeftNum;
                    const newOuterNum = otherNum(tile, matchNum);
                    state.train.unshift({
                        tile,
                        leftNum: newOuterNum,
                        rightNum: matchNum,
                    });
                    state.trainLeftNum = newOuterNum;
                } else {
                    // right
                    const matchNum = state.trainRightNum;
                    const newOuterNum = otherNum(tile, matchNum);
                    state.train.push({
                        tile,
                        leftNum: matchNum,
                        rightNum: newOuterNum,
                    });
                    state.trainRightNum = newOuterNum;
                }
                state.consecutivePasses = 0;
            }

            // ──────────────────────────────────────────────
            // GAME: Remove tile from hand
            // ──────────────────────────────────────────────
            function removeFromHand(hand, tileId) {
                const idx = hand.findIndex(t => t.id === tileId);
                if (idx >= 0) return hand.splice(idx, 1)[0];
                return null;
            }

            // ──────────────────────────────────────────────
            // GAME: Check round end
            // ──────────────────────────────────────────────
            function checkRoundEnd() {
                if (state.playerHand.length === 0) {
                    endRound('player');
                    return true;
                }
                if (state.aiHand.length === 0) {
                    endRound('ai');
                    return true;
                }
                if (state.boneyard.length === 0 && state.consecutivePasses >= 2) {
                    // Both players stuck, compare pip counts
                    const playerPips = state.playerHand.reduce((s, t) => s + tileSum(t), 0);
                    const aiPips = state.aiHand.reduce((s, t) => s + tileSum(t), 0);
                    if (playerPips < aiPips) endRound('player');
                    else if (aiPips < playerPips) endRound('ai');
                    else endRound('tie');
                    return true;
                }
                return false;
            }

            // ──────────────────────────────────────────────
            // GAME: End round
            // ──────────────────────────────────────────────
            function endRound(winner) {
                state.roundOver = true;
                state.winner = winner;
                let points = 0;
                if (winner === 'player') {
                    points = state.aiHand.reduce((s, t) => s + tileSum(t), 0);
                    state.playerScore += points;
                    animState.scoreFlashPlayer = true;
                    animState.scoreFlashStart = performance.now();
                } else if (winner === 'ai') {
                    points = state.playerHand.reduce((s, t) => s + tileSum(t), 0);
                    state.aiScore += points;
                    animState.scoreFlashAI = true;
                    animState.scoreFlashStart = performance.now();
                }
                // Spawn particles
                spawnParticles(winner, points);
                if (state.playerScore >= TARGET_SCORE || state.aiScore >= TARGET_SCORE) {
                    state.gameOver = true;
                }
                updateUI();
                renderBoard();
            }

            // ──────────────────────────────────────────────
            // GAME: Draw tile for a player
            // ──────────────────────────────────────────────
            function drawTile(hand) {
                if (state.boneyard.length === 0) return null;
                const tile = state.boneyard.pop();
                hand.push(tile);
                return tile;
            }

            // ──────────────────────────────────────────────
            // GAME: Player attempts to play a tile
            // ──────────────────────────────────────────────
            function playerPlayTile(tileId, side) {
                if (state.roundOver || state.gameOver) return false;
                if (state.currentTurn !== 'player') return false;
                const tile = state.playerHand.find(t => t.id === tileId);
                if (!tile) return false;

                const playable = getPlayableTiles(state.playerHand);
                const match = playable.find(p => p.tile.id === tileId);
                if (!match) return false;

                if (state.firstMove) {
                    if (side !== 'right' && side !== 'left') side = 'right';
                } else {
                    if (side === 'left' && !match.canLeft) return false;
                    if (side === 'right' && !match.canRight) return false;
                    if (!match.canLeft && side === 'left') side = 'right';
                    if (!match.canRight && side === 'right') side = 'left';
                }

                removeFromHand(state.playerHand, tileId);
                placeTile(tile, side);
                addSettlingAnimation(tile, side);
                updateUI();
                renderBoard();

                if (!checkRoundEnd()) {
                    state.currentTurn = 'ai';
                    updateUI();
                    renderBoard();
                    scheduleAIMove();
                }
                return true;
            }

            // ──────────────────────────────────────────────
            // GAME: Player draws from boneyard
            // ──────────────────────────────────────────────
            function playerDraw() {
                if (state.roundOver || state.gameOver) return;
                if (state.currentTurn !== 'player') return;
                const playableBefore = getPlayableTiles(state.playerHand);
                if (playableBefore.length > 0 && !state.firstMove) return; // Don't draw if can play

                if (state.boneyard.length === 0) {
                    state.consecutivePasses++;
                    state.currentTurn = 'ai';
                    updateUI();
                    renderBoard();
                    if (!checkRoundEnd()) scheduleAIMove();
                    return;
                }

                const drawn = drawTile(state.playerHand);
                updateUI();
                renderBoard();

                if (drawn) {
                    const playableAfter = getPlayableTiles(state.playerHand);
                    if (playableAfter.length === 0 && !state.firstMove) {
                        // Still can't play after drawing
                        if (state.boneyard.length === 0) {
                            state.consecutivePasses++;
                            state.currentTurn = 'ai';
                            updateUI();
                            renderBoard();
                            if (!checkRoundEnd()) scheduleAIMove();
                        } else {
                            // Auto-draw again after brief delay
                            setTimeout(() => playerDraw(), 400);
                        }
                    } else {
                        // Can now play; stay player's turn
                        updateUI();
                        renderBoard();
                    }
                }
            }

            // ──────────────────────────────────────────────
            // ANIMATION: Add settling animation for tile
            // ──────────────────────────────────────────────
            function addSettlingAnimation(tile, side) {
                const idx = state.train.findIndex(t => t.tile.id === tile.id);
                if (idx < 0) return;
                // Calculate target world position
                let targetWorldX;
                if (idx === 0 && state.train.length === 1) {
                    targetWorldX = 0;
                } else if (side === 'left') {
                    targetWorldX = -(state.train.length - 1) * (TILE_WIDTH + TILE_GAP) / 2;
                    // Actually need to recalculate all positions... simplify:
                    targetWorldX = getTileWorldX(0);
                } else {
                    targetWorldX = getTileWorldX(state.train.length - 1);
                }
                const targetWorldY = 0;
                const startWorldX = side === 'left' ? targetWorldX - 120 : targetWorldX + 120;
                const startWorldY = targetWorldY - 50;

                animState.settlingTiles.push({
                    tileId: tile.id,
                    startX: startWorldX,
                    startY: startWorldY,
                    targetX: targetWorldX,
                    targetY: targetWorldY,
                    startTime: performance.now(),
                    duration: ANIMATION_DURATION,
                });
            }

            function getTileWorldX(index) {
                const totalWidth = state.train.length * TILE_WIDTH + (state.train.length - 1) * TILE_GAP;
                const startX = -totalWidth / 2;
                return startX + index * (TILE_WIDTH + TILE_GAP);
            }

            // ──────────────────────────────────────────────
            // PARTICLES
            // ──────────────────────────────────────────────
            function spawnParticles(winner, points) {
                const count = Math.min(60, 20 + points);
                const colors = winner === 'player' ?
                    ['#4da6ff', '#7cc0ff', '#a0d4ff', '#ffdd57', '#ffffff'] :
                    winner === 'ai' ?
                    ['#e85d75', '#ff7b93', '#ffa0b4', '#ffdd57', '#ffffff'] :
                    ['#c0c0c0', '#e0e0e0', '#ffffff'];
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 60 + Math.random() * 250;
                    animState.particles.push({
                        x: 0,
                        y: 0,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 80,
                        life: 1,
                        decay: 0.6 + Math.random() * 1.2,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        size: 2 + Math.random() * 5,
                    });
                }
            }

            function updateParticles(dt) {
                for (let i = animState.particles.length - 1; i >= 0; i--) {
                    const p = animState.particles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vy += 120 * dt; // gravity
                    p.life -= p.decay * dt;
                    if (p.life <= 0) animState.particles.splice(i, 1);
                }
            }

            function renderParticles(ctx, scale, offsetX, offsetY) {
                for (const p of animState.particles) {
                    const alpha = Math.max(0, p.life);
                    const sx = p.x * scale + offsetX;
                    const sy = p.y * scale + offsetY;
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(sx, sy, p.size * scale, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // ──────────────────────────────────────────────
            // AI: Advanced Heuristic (Expectiminimax-lite)
            // ──────────────────────────────────────────────
            function getAIMove() {
                const playable = getPlayableTiles(state.aiHand);
                if (playable.length === 0) return null;

                if (state.firstMove) {
                    // Play highest double if available, else highest sum tile
                    const doubles = playable.filter(p => p.tile.top === p.tile.bottom);
                    if (doubles.length > 0) {
                        doubles.sort((a, b) => b.tile.top - a.tile.top);
                        return { tile: doubles[0].tile, side: 'right' };
                    }
                    playable.sort((a, b) => tileSum(b.tile) - tileSum(a.tile));
                    return { tile: playable[0].tile, side: 'right' };
                }

                // Build probability estimate of opponent's hand
                const allRemainingUnknown = [...state.boneyard, ...state.playerHand];
                const totalUnknown = allRemainingUnknown.length;
                const numProb = [0, 0, 0, 0, 0, 0, 0]; // probability weight for each number 0-6
                for (const t of allRemainingUnknown) {
                    numProb[t.top]++;
                    numProb[t.bottom]++;
                }
                for (let i = 0; i <= 6; i++) {
                    numProb[i] = totalUnknown > 0 ? numProb[i] / (totalUnknown * 2) : 0;
                }

                // Score each possible move
                const scoredMoves = [];
                for (const move of playable) {
                    const sides = [];
                    if (move.canLeft && !state.firstMove) sides.push('left');
                    if (move.canRight && !state.firstMove) sides.push('right');
                    if (state.firstMove) sides.push('right');

                    for (const side of sides) {
                        let score = 0;

                        // Simulate the move
                        const simTrainLeft = side === 'left' ?
                            otherNum(move.tile, state.trainLeftNum) : state.trainLeftNum;
                        const simTrainRight = side === 'right' ?
                            otherNum(move.tile, state.trainRightNum) : state.trainRightNum;
                        const newOpenNums = [simTrainLeft, simTrainRight];

                        // 1. Shed high pip count (weight: higher when near endgame)
                        const endgameFactor = state.aiHand.length <= 3 ? 2.5 : 1.0;
                        score += tileSum(move.tile) * endgameFactor * 1.8;

                        // 2. Block opponent: penalize leaving numbers opponent likely has
                        let blockScore = 0;
                        for (const openNum of newOpenNums) {
                            blockScore += (1 - numProb[openNum]) * 15;
                        }
                        score += blockScore;

                        // 3. Flexibility: prefer keeping diverse numbers in hand
                        const remainingHand = state.aiHand.filter(t => t.id !== move.tile.id);
                        const uniqueNums = new Set();
                        for (const t of remainingHand) {
                            uniqueNums.add(t.top);
                            uniqueNums.add(t.bottom);
                        }
                        score += uniqueNums.size * 3;

                        // 4. Doubles are slightly riskier (reduce opponent's options less)
                        if (move.tile.top === move.tile.bottom) {
                            score -= 4;
                        }

                        // 5. If this move would leave the opponent with few options, bonus
                        const opponentPlayableEstimate = state.playerHand.filter(pt => {
                            return newOpenNums.some(n => tileMatches(pt, n));
                        }).length;
                        score -= opponentPlayableEstimate * 5; // Fewer opponent options = better

                        // 6. Near-win bonus
                        if (remainingHand.length === 0) score += 1000;

                        scoredMoves.push({ tile: move.tile, side, score });
                    }
                }

                scoredMoves.sort((a, b) => b.score - a.score);
                // Add slight randomness among top choices
                const topScore = scoredMoves[0].score;
                const topMoves = scoredMoves.filter(m => m.score >= topScore - 8);
                const chosen = topMoves[Math.floor(Math.random() * topMoves.length)];
                return { tile: chosen.tile, side: chosen.side };
            }

            function scheduleAIMove() {
                if (state.roundOver || state.gameOver) return;
                if (state.currentTurn !== 'ai') return;
                updateUI();
                renderBoard();

                setTimeout(() => {
                    if (state.roundOver || state.gameOver) return;
                    const playable = getPlayableTiles(state.aiHand);

                    if (playable.length === 0 && !state.firstMove) {
                        // AI must draw
                        if (state.boneyard.length > 0) {
                            const drawn = drawTile(state.aiHand);
                            updateUI();
                            renderBoard();
                            // Check again after drawing
                            setTimeout(() => {
                                const playableAfter = getPlayableTiles(state.aiHand);
                                if (playableAfter.length === 0 && !state.firstMove) {
                                    if (state.boneyard.length === 0) {
                                        state.consecutivePasses++;
                                        state.currentTurn = 'player';
                                        updateUI();
                                        renderBoard();
                                        checkRoundEnd();
                                    } else {
                                        // Keep drawing
                                        scheduleAIMove();
                                    }
                                } else {
                                    scheduleAIMove();
                                }
                            }, 350);
                        } else {
                            state.consecutivePasses++;
                            state.currentTurn = 'player';
                            updateUI();
                            renderBoard();
                            checkRoundEnd();
                        }
                        return;
                    }

                    const aiMove = getAIMove();
                    if (!aiMove) {
                        state.consecutivePasses++;
                        state.currentTurn = 'player';
                        updateUI();
                        renderBoard();
                        checkRoundEnd();
                        return;
                    }

                    removeFromHand(state.aiHand, aiMove.tile.id);
                    placeTile(aiMove.tile, aiMove.side);
                    addSettlingAnimation(aiMove.tile, aiMove.side);
                    updateUI();
                    renderBoard();

                    if (!checkRoundEnd()) {
                        state.currentTurn = 'player';
                        updateUI();
                        renderBoard();
                        // Check if player can play; if not, auto-draw
                        const playerPlayable = getPlayableTiles(state.playerHand);
                        if (playerPlayable.length === 0 && !state.firstMove && state.boneyard.length >
                            0) {
                            setTimeout(() => playerDraw(), 500);
                        }
                    }
                }, AI_THINK_DELAY);
            }

            // ──────────────────────────────────────────────
            // UI: Update all UI elements
            // ──────────────────────────────────────────────
            function updateUI() {
                // Scores
                playerScoreEl.textContent = state.playerScore;
                aiScoreEl.textContent = state.aiScore;

                if (animState.scoreFlashPlayer) {
                    playerScoreEl.classList.add('flash');
                    setTimeout(() => playerScoreEl.classList.remove('flash'), 600);
                    animState.scoreFlashPlayer = false;
                }
                if (animState.scoreFlashAI) {
                    aiScoreEl.classList.add('flash');
                    setTimeout(() => aiScoreEl.classList.remove('flash'), 600);
                    animState.scoreFlashAI = false;
                }

                // Turn indicator
                if (state.gameOver) {
                    turnIndicator.className = state.winner === 'player' ? 'player-turn' : 'ai-turn';
                    turnLabel.textContent = state.winner === 'player' ? 'You Win! 🎉' :
                        state.winner === 'ai' ? 'AI Wins!' : 'Tie!';
                    statusText.textContent = state.playerScore >= TARGET_SCORE ?
                        'Game over - you reached 100!' :
                        state.aiScore >= TARGET_SCORE ? 'Game over - AI reached 100!' :
                        'Round over';
                    statusText.classList.add('highlight');
                } else if (state.roundOver) {
                    turnIndicator.className = state.winner === 'player' ? 'player-turn' : 'ai-turn';
                    turnLabel.textContent = state.winner === 'player' ? 'Round Won! 🎉' :
                        state.winner === 'ai' ? 'AI Won Round' : 'Tie Round';
                    statusText.textContent = 'Starting new round soon...';
                    statusText.classList.add('highlight');
                } else if (state.currentTurn === 'player') {
                    turnIndicator.className = 'player-turn';
                    turnLabel.textContent = 'Your Turn';
                    const playable = getPlayableTiles(state.playerHand);
                    if (state.firstMove) {
                        statusText.textContent = 'Play any tile to start';
                    } else if (playable.length === 0) {
                        statusText.textContent = state.boneyard.length > 0 ?
                            'No playable tiles — drawing...' : 'No moves — passing';
                    } else {
                        statusText.textContent = 'Drag a tile to the left or right end';
                    }
                    statusText.classList.remove('highlight');
                } else {
                    turnIndicator.className = 'ai-turn';
                    turnLabel.textContent = 'AI Thinking...';
                    statusText.textContent = 'Please wait';
                    statusText.classList.remove('highlight');
                }

                // Player hand DOM
                renderPlayerHand();
            }

            function renderPlayerHand() {
                playerHandEl.innerHTML = '';
                const playable = getPlayableTiles(state.playerHand);
                const playableIds = new Set(playable.map(p => p.tile.id));

                for (let i = 0; i < state.playerHand.length; i++) {
                    const tile = state.playerHand[i];
                    const el = document.createElement('div');
                    el.className = 'domino-tile';
                    if (playableIds.has(tile.id) && state.currentTurn === 'player' && !state.roundOver && !state
                        .gameOver) {
                        el.classList.add('playable');
                    }
                    el.dataset.tileId = tile.id;
                    el.dataset.index = i;
                    el.innerHTML = `
                <div class="tile-half">${tile.top}</div>
                <div class="tile-divider"></div>
                <div class="tile-half">${tile.bottom}</div>
              `;
                    el.addEventListener('pointerdown', onTilePointerDown);
                    playerHandEl.appendChild(el);
                }
            }

            // ──────────────────────────────────────────────
            // DRAG & DROP HANDLING
            // ──────────────────────────────────────────────
            function onTilePointerDown(e) {
                if (state.roundOver || state.gameOver) return;
                if (state.currentTurn !== 'player') return;
                const tileEl = e.currentTarget;
                const tileId = parseInt(tileEl.dataset.tileId);
                const tileIndex = parseInt(tileEl.dataset.index);
                const tile = state.playerHand.find(t => t.id === tileId);
                if (!tile) return;

                const playable = getPlayableTiles(state.playerHand);
                const match = playable.find(p => p.tile.id === tileId);
                if (!match && !state.firstMove) return; // Can't play this tile
                if (playable.length > 0 && !match && !state.firstMove) return;

                e.preventDefault();
                tileEl.setPointerCapture(e.pointerId);
                const rect = tileEl.getBoundingClientRect();

                dragState.active = true;
                dragState.tile = tile;
                dragState.tileIndex = tileIndex;
                dragState.startX = e.clientX;
                dragState.startY = e.clientY;
                dragState.currentX = e.clientX;
                dragState.currentY = e.clientY;
                dragState.origRect = rect;
                dragState.tileEl = tileEl;

                tileEl.classList.add('dragging');

                // Show ghost
                ghostTileEl.style.display = 'flex';
                ghostTopEl.textContent = tile.top;
                ghostBottomEl.textContent = tile.bottom;
                ghostTileEl.style.left = e.clientX + 'px';
                ghostTileEl.style.top = e.clientY + 'px';
                ghostTileEl.style.opacity = '0.9';

                document.addEventListener('pointermove', onPointerMove);
                document.addEventListener('pointerup', onPointerUp);
                document.addEventListener('pointercancel', onPointerUp);
            }

            function onPointerMove(e) {
                if (!dragState.active) return;
                dragState.currentX = e.clientX;
                dragState.currentY = e.clientY;
                ghostTileEl.style.left = e.clientX + 'px';
                ghostTileEl.style.top = e.clientY + 'px';

                // Check drop zones
                checkDropZones(e.clientX, e.clientY);
                renderBoard();
            }

            function onPointerUp(e) {
                document.removeEventListener('pointermove', onPointerMove);
                document.removeEventListener('pointerup', onPointerUp);
                document.removeEventListener('pointercancel', onPointerUp);

                if (!dragState.active) return;
                const droppedOnZone = animState.dropZoneHighlight;
                const tile = dragState.tile;

                // Clean up drag state
                if (dragState.tileEl) dragState.tileEl.classList.remove('dragging');
                dragState.active = false;
                dragState.tile = null;
                dragState.tileEl = null;
                ghostTileEl.style.display = 'none';
                animState.dropZoneHighlight = null;
                animState.targetHighlightAlpha = 0;

                if (droppedOnZone && tile) {
                    const success = playerPlayTile(tile.id, droppedOnZone);
                    if (!success) {
                        // Invalid drop, do nothing (tile stays)
                    }
                }
                renderBoard();
                updateUI();
            }

            function checkDropZones(clientX, clientY) {
                const canvasRect = canvas.getBounding
