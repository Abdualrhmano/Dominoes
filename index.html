<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dominoes — Luxury Skeuomorphic — Modular</title>

  <!-- Core styles (skeuomorphic) -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app" class="app-wrap" aria-live="polite">
    <!-- Top bar / scoreboard -->
    <header class="scoreboard" role="region" aria-label="Scoreboard">
      <div class="score-left">
        <div class="score-card">
          <h4>Player</h4>
          <p id="player-score">0</p>
          <div class="muted">vs 101</div>
        </div>
        <div class="score-card">
          <h4>AI Opponent</h4>
          <p id="ai-score">0</p>
          <div class="muted">vs 101</div>
        </div>
      </div>

      <div class="score-center">
        <div class="muted">Round</div>
        <div id="round-number" class="round-number">1</div>
      </div>

      <div class="score-right">
        <button id="reset-match" class="btn">Reset Match</button>
        <div class="status">
          <div id="turn-indicator">—</div>
          <div id="status-text" class="muted">Welcome to Dominoes</div>
        </div>
      </div>
    </header>

    <!-- Board container: board.js will render the 2D board inside #board-canvas -->
    <main class="board-wrap" id="board-wrap" role="application" aria-label="Dominoes table">
      <div id="board-canvas" class="board-canvas" aria-hidden="false"></div>

      <!-- UI overlays -->
      <div id="placement-hints" class="placement-hints" aria-hidden="true">
        <div id="hint-left" class="hint-dot"></div>
        <div id="hint-right" class="hint-dot"></div>
      </div>

      <!-- Boneyard -->
      <div id="boneyard-ui" class="boneyard-ui" aria-label="Boneyard">
        <div id="bone-stack" class="bone-stack" title="Draw a tile">Boneyard</div>
        <div id="boneyard-count" class="muted">28</div>
      </div>

      <!-- Tooltip -->
      <div id="first-move-tooltip" class="hint-tooltip" aria-hidden="true"></div>
    </main>

    <!-- Player hand area (UI module will render tiles here and attach drag/drop) -->
    <aside class="hand" id="player-hand-area" aria-label="Player hand">
      <div class="hand-inner" id="player-hand" role="list"></div>
    </aside>

    <!-- Modal root -->
    <div id="modal-root" class="modal-root" aria-hidden="true"></div>

    <!-- Confetti canvas (managed by UI) -->
    <canvas id="confetti" class="confetti-canvas" width="1920" height="1080" aria-hidden="true"></canvas>
  </div>

  <!-- Main orchestrator (ES module) -->
  <script type="module" src="js/main.js"></script>
</body>
    </html>
