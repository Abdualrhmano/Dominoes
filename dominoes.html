<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dominoes — Professional Web Edition</title>

  <!-- Tailwind optional helper (keeps utilities available) -->
  <script src="https://cdn.tailwindcss.com" defer></script>

  <!-- ============================================================
       Phase: Full Production-ready Single-file App
       - Modular JS (ES6+ classes & IIFE modules)
       - Clear separation: CSS (presentation) vs JS (logic)
       - State machine for game flow
       - Dual-mode AI (Easy / Hard)
       - Performance-minded animations (transform/opacity)
       - Accessibility & responsive layout
       ============================================================ -->
  <style>
    /* ===========================
       Design Tokens / Variables
       =========================== */
    :root{
      /* Colors */
      --bg-900: #071018;
      --bg-800: #0b1220;
      --glass: rgba(255,255,255,0.06);
      --glass-2: rgba(255,255,255,0.03);
      --accent-gold: #ffd166;
      --accent-cyan: #7ef9ff;
      --muted: #9aa4b2;
      --tile-light: #e6eef6;
      --danger: #ff6b6b;

      /* Spacing */
      --space-xs: 6px;
      --space-sm: 12px;
      --space-md: 18px;
      --space-lg: 28px;

      /* Motion */
      --fast: 160ms;
      --medium: 360ms;
      --slow: 600ms;
      --easing: cubic-bezier(.2,.9,.3,1);

      /* Radii & elevation */
      --radius-lg: 14px;
      --radius-md: 10px;
      --elevation-1: 0 10px 40px rgba(0,0,0,0.6);
    }

    /* ===========================
       Global Reset & Base
       =========================== */
    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; background:
      radial-gradient(900px 400px at 10% 10%, rgba(14,18,24,0.6), transparent),
      linear-gradient(180deg,var(--bg-900), #041018 140%); color:var(--tile-light); }
    a{ color:inherit; text-decoration:none; }

    /* ===========================
       App container
       =========================== */
    .app {
      max-width:1200px;
      margin:28px auto;
      padding:18px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    /* ===========================
       Glass panels (header, board, footer)
       =========================== */
    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius: var(--radius-lg);
      border: 1px solid var(--glass-2);
      box-shadow: var(--elevation-1);
      backdrop-filter: blur(8px) saturate(120%);
      padding:12px;
    }

    /* Header / Scoreboard */
    .header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .score {
      display:flex;
      gap:12px;
      align-items:center;
    }
    .score-card {
      min-width:150px;
      padding:10px 14px;
      border-radius:10px;
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
      border:1px solid rgba(255,255,255,0.02);
      text-align:center;
    }
    .score-card h4{ margin:0; color:var(--accent-gold); font-size:13px; letter-spacing:0.6px; }
    .score-card p{ margin:6px 0 0 0; font-weight:800; font-size:20px; }

    /* Header controls */
    .controls { display:flex; gap:10px; align-items:center; }

    /* ===========================
       Board area
       =========================== */
    .board {
      position:relative;
      min-height:380px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    /* Train wrapper: single-line horizontal, smooth scroll */
    .train-wrap {
      width:100%;
      padding:12px;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:10px;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scroll-behavior:smooth;
      white-space:nowrap; /* prevent wrapping */
      will-change:scroll-position;
    }
    .train-wrap::-webkit-scrollbar{ height:8px; }
    .train-wrap::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.04); border-radius:8px; }

    /* Placement hint dots */
    .placement-hints {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      left:12px;
      display:flex;
      gap:8px;
      z-index:30;
      pointer-events:none;
    }
    .hint-dot {
      width:12px; height:12px; border-radius:50%;
      background: linear-gradient(180deg,var(--accent-cyan), #3ee7ff);
      box-shadow: 0 8px 20px rgba(62,231,255,0.08);
      opacity:0; transform:scale(0.6);
      transition: all var(--fast) var(--easing);
    }
    .hint-dot.show{ opacity:1; transform:scale(1); }

    /* Boneyard */
    .boneyard {
      position:absolute;
      top:12px;
      right:12px;
      display:flex;
      gap:8px;
      align-items:center;
      z-index:40;
    }
    .bone-stack {
      width:72px; height:44px; border-radius:10px;
      background: linear-gradient(180deg,#0b1220,#071018);
      border:1px solid rgba(255,255,255,0.03);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display:flex; align-items:center; justify-content:center;
      color:var(--muted); font-weight:700; font-size:13px; cursor:pointer;
      user-select:none;
      transition: transform var(--fast) var(--easing);
    }
    .bone-stack:active{ transform: translateY(2px); }

    /* ===========================
       Domino tile visuals
       - 3D tactile feel using transform + shadow
       - All interactive states use transform/opacity only
       =========================== */
    .tile {
      display:inline-flex;
      width:92px;
      height:48px;
      border-radius:10px;
      background: linear-gradient(180deg,#0f1724,#0b1220);
      border:1px solid rgba(255,255,255,0.03);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      align-items:center;
      justify-content:space-between;
      padding:8px;
      gap:6px;
      transform-origin:center;
      will-change: transform, opacity;
      transition: transform var(--fast) var(--easing), box-shadow var(--fast) var(--easing), opacity var(--fast) var(--easing);
      user-select:none;
    }
    .tile .half { display:flex; align-items:center; justify-content:center; gap:6px; flex:1; }
    .tile .divider { width:2px; height:100%; background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.2)); border-radius:2px; margin:0 6px; }

    /* pip style */
    .pip {
      width:8px; height:8px; border-radius:50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.06), rgba(255,255,255,0.02)), var(--accent-cyan);
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }

    /* tactile states */
    .tile:hover { transform: translateY(-8px) rotateX(2deg) scale(1.03); box-shadow: 0 20px 60px rgba(0,0,0,0.7); }
    .tile:active { transform: translateY(-2px) scale(0.995); }
    .tile:focus { outline: 3px solid rgba(126,249,255,0.12); outline-offset:4px; }

    /* playable highlight */
    .tile.playable { box-shadow: 0 22px 70px rgba(126,249,255,0.06), 0 10px 40px rgba(0,0,0,0.7); transform: translateY(-10px) scale(1.04); border:1px solid rgba(126,249,255,0.08); }

    /* small screens */
    @media (max-width:640px){
      .tile{ width:72px; height:40px; padding:6px; border-radius:8px; }
      .bone-stack{ width:60px; height:36px; }
    }

    /* ===========================
       Footer / Player hand
       =========================== */
    .footer {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .hand {
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:center;
      overflow:auto;
      padding:8px;
      border-radius:10px;
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
      border:1px solid rgba(255,255,255,0.02);
    }

    /* ===========================
       Modal (glassmorphism)
       =========================== */
    .modal-backdrop {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background: linear-gradient(180deg, rgba(2,6,12,0.6), rgba(2,6,12,0.85));
      z-index:60; backdrop-filter: blur(8px) saturate(120%);
    }
    .modal {
      width:min(720px, 92%); padding:20px; border-radius:var(--radius-lg);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid var(--glass-2); box-shadow: var(--elevation-1);
      transform: translateY(8px); transition: transform var(--medium) var(--easing), opacity var(--medium) var(--easing);
    }

    /* Buttons */
    .btn {
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:10px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.04); color:var(--tile-light); cursor:pointer;
      transition: transform var(--fast) var(--easing), box-shadow var(--fast) var(--easing);
    }
    .btn:active { transform: translateY(1px) scale(0.998); }
    .btn.primary { background: linear-gradient(180deg, rgba(255,209,102,0.12), rgba(255,209,102,0.06)); color:#071018; border:1px solid rgba(255,209,102,0.18); }

    /* small helpers */
    .muted { color:var(--muted); font-size:13px; }
    .center { display:flex; align-items:center; justify-content:center; }
    .sr-only { position:absolute; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden; }

    /* Performance: prefer transform/opacity for animations */
    .anim-snap { animation: snap var(--medium) var(--easing) both; }
    @keyframes snap {
      0%{ transform: scale(0.6) rotate(-8deg); opacity:0; }
      60%{ transform: scale(1.05) rotate(6deg); opacity:1; }
      100%{ transform: scale(1) rotate(0deg); opacity:1; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <!-- Header -->
    <header class="panel header" role="banner" aria-label="Scoreboard">
      <div class="score" aria-hidden="false">
        <div class="score-card" aria-live="polite">
          <h4>اللاعب</h4>
          <p id="player-score">0</p>
          <div class="muted">vs 101</div>
        </div>
        <div class="score-card" aria-live="polite">
          <h4>الذكاء الاصطناعي</h4>
          <p id="ai-score">0</p>
          <div class="muted">vs 101</div>
        </div>
      </div>

      <div class="muted">الجولة <strong id="round-number">1</strong></div>

      <div class="controls">
        <select id="ai-mode" class="btn" title="AI Mode" aria-label="AI Mode">
          <option value="easy">AI: سهل</option>
          <option value="hard" selected>AI: صعب</option>
        </select>
        <button id="reset-match" class="btn">إعادة المباراة</button>
        <div class="muted" id="status">جاهز</div>
      </div>
    </header>

    <!-- Board -->
    <main class="panel board" role="main" aria-label="Game board">
      <div class="placement-hints" id="placement-hints" aria-hidden="true">
        <div class="hint-dot" id="hint-left"></div>
        <div class="hint-dot" id="hint-right"></div>
      </div>

      <div class="boneyard" id="boneyard">
        <div class="bone-stack" id="bone-stack" role="button" aria-label="Boneyard">السحب</div>
        <div class="muted" id="boneyard-count">28</div>
      </div>

      <div class="train-wrap" id="train-wrap" role="list" aria-label="Domino train">
        <!-- Tiles injected by JS -->
      </div>

      <div class="sr-only" id="live-announcer" aria-live="polite"></div>
    </main>

    <!-- Footer / Player hand -->
    <footer class="panel footer" role="contentinfo">
      <div class="hand" id="player-hand" aria-label="Player hand">
        <!-- Player tiles injected by JS -->
      </div>

      <div style="display:flex; gap:8px; align-items:center;">
        <button id="draw-btn" class="btn">سحب</button>
        <button id="end-turn-btn" class="btn primary">إنهاء الدور</button>
      </div>
    </footer>

    <!-- Modal root -->
    <div id="modal-root" aria-hidden="true"></div>

    <!-- Confetti canvas -->
    <canvas id="confetti" style="position:fixed; inset:0; pointer-events:none; z-index:80; display:none;"></canvas>
  </div>

  <!-- ===========================
       JavaScript: Modular, ES6+, heavily commented
       Structure:
         - Utils (helpers)
         - Models (Tile)
         - StateMachine (turns & phases)
         - GameEngine (core state & rendering)
         - AI (Easy & Hard)
         - UI (DOM rendering & interactions)
       =========================== -->
  <script>
  /* =========================================================================
     Dominoes — Professional Web Edition
     Author: Senior Front-End Game Developer (structured & commented)
     Notes:
       - All state is managed inside GameEngine
       - UI module only reads state and renders; minimal logic in UI
       - StateMachine enforces valid transitions
       - AI module is pure logic (no DOM)
     ========================================================================= */

  (function () {
    'use strict';

    /* =========================
       Utilities
       ========================= */
    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const rand = n => Math.floor(Math.random() * n);
    const sleep = ms => new Promise(res => setTimeout(res, ms));

    /* =========================
       Tile Model
       Immutable representation of a domino tile
       { a: number, b: number, id: string }
       ========================= */
    class Tile {
      constructor(a, b) {
        this.a = a;
        this.b = b;
        this.id = `${a}-${b}`;
      }
      // pip sum
      sum() { return this.a + this.b; }
      // is double
      isDouble() { return this.a === this.b; }
      // clone
      clone() { return new Tile(this.a, this.b); }
      // flipped clone
      flipped() { return new Tile(this.b, this.a); }
    }

    /* =========================
       State Machine
       - phases: 'setup' -> 'playing' -> 'roundEnd' -> 'matchEnd'
       - turns: 'player' or 'ai'
       - ensures valid transitions and centralizes side effects
       ========================= */
    class StateMachine {
      constructor(engine) {
        this.engine = engine;
        this.phase = 'setup';
        this.turn = null;
      }

      // Start playing phase
      startRound(starter) {
        this.phase = 'playing';
        this.turn = starter;
        this.engine.ui.updateStatus(`${starter === 'player' ? 'دورك' : 'دور AI'}`);
      }

      // Switch turn
      switchTurn() {
        if (this.phase !== 'playing') return;
        this.turn = this.turn === 'player' ? 'ai' : 'player';
        this.engine.ui.updateStatus(`${this.turn === 'player' ? 'دورك' : 'دور AI'}`);
      }

      // End round
      endRound(winner, points, reason) {
        this.phase = 'roundEnd';
        this.engine.onRoundEnd(winner, points, reason);
      }

      // End match
      endMatch(champion) {
        this.phase = 'matchEnd';
        this.engine.onMatchEnd(champion);
      }

      // Reset to setup
      reset() {
        this.phase = 'setup';
        this.turn = null;
      }
    }

    /* =========================
       AI Module
       - Two modes: easy (random playable) and hard (heuristic)
       - Pure functions: accept state, return chosen tile & side
       - Side: 'left' or 'right'
       ========================= */
    const AI = {
      // Determine playable tiles for a hand given train ends
      playableTiles(hand, train) {
        if (train.length === 0) return hand.slice();
        const left = train[0].a;
        const right = train[train.length - 1].b;
        return hand.filter(t => t.a === left || t.b === left || t.a === right || t.b === right);
      },

      // Easy: random playable tile, random valid side
      easyMove(state) {
        const playable = AI.playableTiles(state.hands.ai, state.train);
        if (!playable.length) return null;
        const tile = playable[rand(playable.length)];
        const side = AI.chooseSide(tile, state.train);
        return { tile, side };
      },

      // Hard: heuristic prioritizing doubles and high pip sums, also tries to block player
      hardMove(state) {
        const playable = AI.playableTiles(state.hands.ai, state.train);
        if (!playable.length) return null;

        // Score function: doubles get big bonus, higher sum preferred
        const scoreTile = (tile) => {
          let score = tile.sum();
          if (tile.isDouble()) score += 50;
          // prefer tiles that reduce player's future options: if playing this tile will make ends uncommon
          const left = state.train.length ? state.train[0].a : null;
          const right = state.train.length ? state.train[state.train.length - 1].b : null;
          // penalize leaving ends that player likely has
          const playerCounts = AI.countPips(state.hands.player);
          // if tile placed on right, new right becomes tile.b (after orientation)
          // approximate: prefer moves that create ends with low playerCounts
          const leftImpact = left !== null ? playerCounts[left] : 0;
          const rightImpact = right !== null ? playerCounts[right] : 0;
          score -= Math.min(leftImpact, rightImpact) * 0.5;
          return score;
        };

        playable.sort((x, y) => scoreTile(y) - scoreTile(x));
        const chosen = playable[0];
        const side = AI.chooseSide(chosen, state.train, state.hands.player);
        return { tile: chosen, side };
      },

      // Choose side heuristically: prefer side that keeps higher pip towards center
      chooseSide(tile, train, playerHand = []) {
        if (train.length === 0) return 'right';
        const left = train[0].a;
        const right = train[train.length - 1].b;
        const canLeft = tile.a === left || tile.b === left;
        const canRight = tile.a === right || tile.b === right;
        if (canLeft && !canRight) return 'left';
        if (canRight && !canLeft) return 'right';
        // both possible: choose side that results in end value less common in player's hand
        const playerCounts = AI.countPips(playerHand);
        // if placed on left, new left becomes tile.a or tile.b depending orientation; approximate choose side with lower player count
        const leftEndAfter = (tile.a === left) ? tile.b : tile.a;
        const rightEndAfter = (tile.a === right) ? tile.b : tile.a;
        const leftScore = playerCounts[leftEndAfter] || 0;
        const rightScore = playerCounts[rightEndAfter] || 0;
        return leftScore <= rightScore ? 'left' : 'right';
      },

      // Count pips frequency in a hand
      countPips(hand) {
        const counts = Array(7).fill(0);
        hand.forEach(t => { counts[t.a]++; counts[t.b]++; });
        return counts;
      }
    };

    /* =========================
       Game Engine
       - Holds all game state
       - Responsible for rules, scoring, dealing, and round/match lifecycle
       - Exposes methods for UI to call
       ========================= */
    class GameEngine {
      constructor(ui) {
        this.ui = ui; // UI bridge
        this.state = {
          deck: [],
          boneyard: [],
          hands: { player: [], ai: [] },
          train: [], // placed tiles (Tile instances)
          scores: { player: 0, ai: 0 },
          round: 1,
          starter: null,
          highestDouble: null, // {tile, owner}
          animLock: false,
          aiMode: 'hard'
        };
        this.sm = new StateMachine(this);
        this.motion = { snapMs: 360 }; // sync with CSS
      }

      /* -------------------------
         Setup & Deck utilities
         ------------------------- */
      buildDeck() {
        const deck = [];
        for (let i = 0; i <= 6; i++) {
          for (let j = i; j <= 6; j++) {
            deck.push(new Tile(i, j));
          }
        }
        return deck;
      }

      shuffle(arr) {
        // Fisher-Yates
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      dealHands() {
        // Each player gets 7 tiles
        this.state.hands.player = [];
        this.state.hands.ai = [];
        for (let i = 0; i < 7; i++) {
          this.state.hands.player.push(this.state.boneyard.pop());
          this.state.hands.ai.push(this.state.boneyard.pop());
        }
      }

      startMatch() {
        // Reset scores & round
        this.state.scores = { player: 0, ai: 0 };
        this.state.round = 1;
        this.ui.updateScoreboard(this.state.scores, this.state.round);
        this.startRound(true);
      }

      startRound(isInitial = false, prevWinner = null) {
        // Reset board & deck
        this.state.deck = this.buildDeck();
        this.shuffle(this.state.deck);
        this.state.boneyard = [...this.state.deck];
        this.state.train = [];
        this.state.hands.player = [];
        this.state.hands.ai = [];
        this.dealHands();
        this.state.highestDouble = this.findHighestDouble();
        this.state.animLock = false;

        // Determine starter
        if (isInitial) {
          this.state.starter = this.determineStarter();
        } else {
          this.state.starter = prevWinner || this.state.starter || 'player';
        }

        // Round first move flag
        this.state.roundFirstMove = true;

        // Update UI
        this.ui.renderAll(this.state);
        this.ui.updateBoneyardCount(this.state.boneyard.length);
        this.ui.updateScoreboard(this.state.scores, this.state.round);

        // Start state machine
        this.sm.startRound(this.state.starter);

        // If AI starts, schedule AI move
        if (this.sm.turn === 'ai') {
          this.ui.announce('AI يبدأ الجولة');
          this.scheduleAI(700);
        } else {
          // If player starts and must play highest double, show hint
          if (this.state.highestDouble && this.state.highestDouble.owner === 'player') {
            this.ui.showTooltip(`يجب أن تبدأ بأعلى دبل لديك: ${this.state.highestDouble.tile.id}`);
          }
        }
      }

      // Find highest double across both hands
      findHighestDouble() {
        const all = [...this.state.hands.player.map(t => ({ tile: t, owner: 'player' })), ...this.state.hands.ai.map(t => ({ tile: t, owner: 'ai' }))];
        const doubles = all.filter(x => x.tile.isDouble());
        if (!doubles.length) return null;
        doubles.sort((x, y) => y.tile.a - x.tile.a);
        return doubles[0]; // {tile, owner}
      }

      // Determine starter by highest double or highest pip sum
      determineStarter() {
        const all = [...this.state.hands.player.map(t => ({ tile: t, owner: 'player' })), ...this.state.hands.ai.map(t => ({ tile: t, owner: 'ai' }))];
        const doubles = all.filter(x => x.tile.isDouble());
        if (doubles.length) {
          doubles.sort((x, y) => y.tile.a - x.tile.a);
          return doubles[0].owner;
        }
        // else highest pip sum
        all.sort((x, y) => (y.tile.sum() - x.tile.sum()));
        return all[0].owner;
      }

      /* -------------------------
         Gameplay: validation & placement
         ------------------------- */

      // Check if a tile is playable for a given player considering first-move highest double rule
      isTilePlayable(tile, who) {
        // If train empty and it's first move and highestDouble exists and owner is starter:
        if (this.state.train.length === 0 && this.state.roundFirstMove && this.state.highestDouble) {
          if (this.state.highestDouble.owner === who) {
            // owner must play that exact tile
            return tile.id === this.state.highestDouble.tile.id;
          } else {
            // other player cannot play until owner plays highest double
            return false;
          }
        }

        if (this.state.train.length === 0) return true;
        const left = this.state.train[0].a;
        const right = this.state.train[this.state.train.length - 1].b;
        return tile.a === left || tile.b === left || tile.a === right || tile.b === right;
      }

      // Get playable tiles for a hand
      getPlayableTiles(hand, who) {
        return hand.filter(t => this.isTilePlayable(t, who));
      }

      // Place tile (common for player & AI)
      async placeTile(tile, who, side = 'right') {
        if (this.state.animLock) return false;
        // Validate
        const hand = who === 'player' ? this.state.hands.player : this.state.hands.ai;
        const idx = hand.findIndex(t => t.id === tile.id);
        if (idx === -1 && who === 'player') return false; // not in player's hand
        if (!this.isTilePlayable(tile, who)) return false;

        this.state.animLock = true;

        // Remove from hand
        if (who === 'player') hand.splice(idx, 1);
        else {
          const aiIdx = this.state.hands.ai.findIndex(t => t.id === tile.id);
          if (aiIdx >= 0) this.state.hands.ai.splice(aiIdx, 1);
        }

        // Orient tile so that matching pip aligns with train end
        const placed = tile.clone();
        if (this.state.train.length === 0) {
          // first tile: push to right
          this.state.train.push(placed);
        } else if (side === 'left') {
          const leftEnd = this.state.train[0].a;
          if (placed.b !== leftEnd) [placed.a, placed.b] = [placed.b, placed.a];
          this.state.train.unshift(placed);
        } else {
          const rightEnd = this.state.train[this.state.train.length - 1].b;
          if (placed.a !== rightEnd) [placed.a, placed.b] = [placed.b, placed.a];
          this.state.train.push(placed);
        }

        // After first placement, clear first-move flag
        if (this.state.roundFirstMove) this.state.roundFirstMove = false;

        // Render & animate
        this.ui.renderTrain(this.state.train);
        this.ui.renderHand(this.state.hands.player);
        this.ui.updateBoneyardCount(this.state.boneyard.length);
        this.ui.announce(`${who === 'player' ? 'اللاعب' : 'AI'} لعب ${tile.id}`);

        // Wait for snap animation to complete then scroll
        await sleep(this.motion.snapMs + 40);
        this.ui.scrollTrainToEnd(side);

        // Unlock
        this.state.animLock = false;

        // Check round end
        const roundOver = this.checkRoundEnd();
        if (!roundOver) {
          // Next turn
          this.sm.switchTurn();
          if (this.sm.turn === 'ai') {
            this.scheduleAI(450);
          }
        }
        return true;
      }

      // Draw from boneyard
      draw(who) {
        if (!this.state.boneyard.length) return null;
        const tile = this.state.boneyard.pop();
        if (who === 'player') {
          this.state.hands.player.push(tile);
          this.ui.renderHand(this.state.hands.player);
        } else {
          this.state.hands.ai.push(tile);
        }
        this.ui.updateBoneyardCount(this.state.boneyard.length);
        this.ui.announce(`${who === 'player' ? 'اللاعب' : 'AI'} سحب قطعة`);
        return tile;
      }

      // Check round end conditions and scoring
      checkRoundEnd() {
        // Domino (empty hand)
        if (this.state.hands.player.length === 0 || this.state.hands.ai.length === 0) {
          const winner = this.state.hands.player.length === 0 ? 'player' : 'ai';
          const loser = winner === 'player' ? 'ai' : 'player';
          const points = this.sumPips(this.state.hands[loser]);
          this.state.scores[winner] += points;
          this.ui.updateScoreboard(this.state.scores, this.state.round);
          this.sm.endRound(winner, points, 'domino');
          return true;
        }

        // Blocked: no playable tiles for both and boneyard empty
        const playerPlayable = this.getPlayableTiles(this.state.hands.player, 'player').length > 0;
        const aiPlayable = this.getPlayableTiles(this.state.hands.ai, 'ai').length > 0;
        if (!playerPlayable && !aiPlayable && this.state.boneyard.length === 0) {
          const playerPips = this.sumPips(this.state.hands.player);
          const aiPips = this.sumPips(this.state.hands.ai);
          let winner = null, points = 0;
          if (playerPips < aiPips) { winner = 'player'; points = aiPips - playerPips; }
          else if (aiPips < playerPips) { winner = 'ai'; points = playerPips - aiPips; }
          // tie -> no points
          if (winner) {
            this.state.scores[winner] += points;
            this.ui.updateScoreboard(this.state.scores, this.state.round);
            this.sm.endRound(winner, points, 'blocked');
          } else {
            this.sm.endRound(null, 0, 'blocked-tie');
          }
          return true;
        }
        return false;
      }

      sumPips(hand) {
        return hand.reduce((s, t) => s + t.a + t.b, 0);
      }

      // Called by StateMachine when round ends
      onRoundEnd(winner, points, reason) {
        // Show modal with round result
        this.ui.showRoundModal(winner, points, reason, this.state.scores);
        // After user clicks next round, engine.startRound(false, winner) will be called by UI
      }

      // Called by StateMachine when match ends
      onMatchEnd(champion) {
        this.ui.showMatchVictory(champion, this.state.scores);
      }

      // Schedule AI move with small delay
      scheduleAI(delay = 500) {
        if (this.state.animLock) return;
        setTimeout(async () => {
          if (this.sm.phase !== 'playing' || this.sm.turn !== 'ai') return;
          // AI decision
          const aiMode = this.state.aiMode;
          let move = null;
          if (this.state.train.length === 0 && this.state.roundFirstMove && this.state.highestDouble && this.state.highestDouble.owner === 'ai') {
            // Force AI to play highest double if it owns it
            const tile = this.state.highestDouble.tile;
            move = { tile, side: 'right' };
          } else {
            if (aiMode === 'easy') move = AI.easyMove(this.state);
            else move = AI.hardMove(this.state);
          }

          if (!move) {
            // draw until playable or boneyard empty
            if (this.state.boneyard.length > 0) {
              this.draw('ai');
              // schedule another attempt
              this.scheduleAI(350);
            } else {
              // pass turn
              this.ui.announce('AI يمرر الدور');
              this.sm.switchTurn();
              this.ui.updateStatus('دورك');
            }
            return;
          }

          // Place chosen tile
          await this.placeTile(move.tile, 'ai', move.side);
        }, delay);
      }

      // End turn (player chooses to end)
      endPlayerTurn() {
        if (this.sm.turn !== 'player') return;
        this.sm.switchTurn();
        if (this.sm.turn === 'ai') this.scheduleAI(400);
      }

      // Reset match (UI triggers)
      resetMatch() {
        this.sm.reset();
        this.startMatch();
      }

      // Set AI mode
      setAIMode(mode) {
        this.state.aiMode = mode;
      }
    }

    /* =========================
       UI Module
       - Responsible for DOM rendering and user interactions
       - Minimal logic: delegates to GameEngine for rules
       ========================= */
    class UI {
      constructor() {
        // DOM refs
        this.trainWrap = $('#train-wrap');
        this.playerHand = $('#player-hand');
        this.boneStack = $('#bone-stack');
        this.boneyardCount = $('#boneyard-count');
        this.playerScoreEl = $('#player-score');
        this.aiScoreEl = $('#ai-score');
        this.roundNumberEl = $('#round-number');
        this.statusEl = $('#status');
        this.modalRoot = $('#modal-root');
        this.placementHints = $('#placement-hints');
        this.hintLeft = $('#hint-left');
        this.hintRight = $('#hint-right');
        this.liveAnnouncer = $('#live-announcer');
        this.confettiCanvas = $('#confetti');

        // Bind UI events placeholders (set by attach)
        this.onTileClick = null;
        this.onDraw = null;
        this.onEndTurn = null;
        this.onResetMatch = null;
        this.onAIModeChange = null;

        // Setup event listeners
        this.setupControls();
      }

      setupControls() {
        // Draw button
        $('#draw-btn').addEventListener('click', () => {
          if (this.onDraw) this.onDraw();
        });
        // End turn
        $('#end-turn-btn').addEventListener('click', () => {
          if (this.onEndTurn) this.onEndTurn();
        });
        // Boneyard click
        this.boneStack.addEventListener('click', () => {
          if (this.onDraw) this.onDraw();
        });
        // Reset match
        $('#reset-match').addEventListener('click', () => {
          if (confirm('إعادة المباراة؟ سيتم إعادة النقاط والجولات.')) {
            if (this.onResetMatch) this.onResetMatch();
          }
        });
        // AI mode select
        $('#ai-mode').addEventListener('change', (e) => {
          if (this.onAIModeChange) this.onAIModeChange(e.target.value);
        });
      }

      /* -------------------------
         Rendering helpers
         ------------------------- */

      // Render entire UI (train + hand)
      renderAll(state) {
        this.renderTrain(state.train);
        this.renderHand(state.hands.player);
        this.updateBoneyardCount(state.boneyard.length);
        this.updateScoreboard(state.scores, state.round);
      }

      // Render train tiles
      renderTrain(train) {
        // Clear and re-render
        this.trainWrap.innerHTML = '';
        train.forEach((tile, idx) => {
          const el = this.createTileElement(tile, false);
          // Add snap animation for newly placed tiles
          el.classList.add('anim-snap');
          el.style.transitionDelay = `${idx * 20}ms`;
          this.trainWrap.appendChild(el);
        });
      }

      // Render player's hand
      renderHand(hand) {
        this.playerHand.innerHTML = '';
        hand.forEach((tile, idx) => {
          const el = this.createTileElement(tile, true);
          el.tabIndex = 0;
          el.dataset.index = idx;
          // Click handler
          el.addEventListener('click', (e) => {
            if (this.onTileClick) this.onTileClick(tile);
          });
          el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              if (this.onTileClick) this.onTileClick(tile);
            }
          });
          this.playerHand.appendChild(el);
        });
      }

      // Create tile DOM element (visual only)
      createTileElement(tile, isHand = false) {
        const wrapper = document.createElement('div');
        wrapper.className = 'tile';
        wrapper.setAttribute('role', 'button');
        wrapper.setAttribute('aria-label', `Tile ${tile.a} and ${tile.b}`);
        // left half
        const left = document.createElement('div');
        left.className = 'half pips-' + tile.a;
        for (let i = 0; i < this.getPipCount(tile.a); i++) {
          const p = document.createElement('div');
          p.className = 'pip';
          left.appendChild(p);
        }
        // divider
        const div = document.createElement('div');
        div.className = 'divider';
        // right half
        const right = document.createElement('div');
        right.className = 'half pips-' + tile.b;
        for (let i = 0; i < this.getPipCount(tile.b); i++) {
          const p = document.createElement('div');
          p.className = 'pip';
          right.appendChild(p);
        }
        wrapper.appendChild(left);
        wrapper.appendChild(div);
        wrapper.appendChild(right);
        return wrapper;
      }

      getPipCount(n) { return n === 0 ? 1 : n; }

      // Update boneyard count
      updateBoneyardCount(count) {
        this.boneyardCount.textContent = count;
      }

      // Update scoreboard
      updateScoreboard(scores, round) {
        this.playerScoreEl.textContent = scores.player;
        this.aiScoreEl.textContent = scores.ai;
        this.roundNumberEl.textContent = round;
      }

      // Update status text
      updateStatus(text) {
        this.statusEl.textContent = text;
      }

      // Announce to live region
      announce(text) {
        this.liveAnnouncer.textContent = text;
        setTimeout(() => { this.liveAnnouncer.textContent = ''; }, 1600);
      }

      // Scroll train to show new tile
      scrollTrainToEnd(side = 'right') {
        try {
          const container = this.trainWrap;
          if (side === 'right') {
            container.scrollTo({ left: container.scrollWidth, behavior: 'smooth' });
          } else {
            container.scrollTo({ left: 0, behavior: 'smooth' });
          }
        } catch (e) { /* ignore */ }
      }

      // Show placement hints (left/right)
      showPlacementHints(canLeft, canRight) {
        if (canLeft) this.hintLeft.classList.add('show'); else this.hintLeft.classList.remove('show');
        if (canRight) this.hintRight.classList.add('show'); else this.hintRight.classList.remove('show');
      }

      hidePlacementHints() {
        this.hintLeft.classList.remove('show');
        this.hintRight.classList.remove('show');
      }

      // Tooltip for first-move rule
      showTooltip(msg, duration = 3000) {
        const tip = document.createElement('div');
        tip.className = 'modal-backdrop';
        tip.innerHTML = `<div class="modal center" style="padding:10px; max-width:420px;"><div style="color:var(--muted)">${msg}</div></div>`;
        document.body.appendChild(tip);
        setTimeout(() => { tip.remove(); }, duration);
      }

      // Round modal
      showRoundModal(winner, points, reason, scores) {
        this.modalRoot.innerHTML = '';
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        const card = document.createElement('div');
        card.className = 'modal';
        const title = winner ? (winner === 'player' ? 'فائز الجولة — أنت' : 'فائز الجولة — AI') : 'نتيجة الجولة';
        const reasonText = reason === 'domino' ? 'أفرغ اليد' : (reason === 'blocked' ? 'اللعبة أغلقت' : 'تعادل في الإغلاق');
        card.innerHTML = `
          <h2 style="color:var(--accent-gold); margin:0 0 8px 0;">${title}</h2>
          <div class="muted" style="margin-bottom:12px;">${reasonText}</div>
          <div style="font-weight:800; font-size:18px; margin-bottom:12px;">${points > 0 ? `نقاط مكتسبة: ${points}` : 'لا نقاط'}</div>
          <div style="margin-bottom:12px; color:var(--muted);">المجموع — أنت: <strong>${scores.player}</strong> • AI: <strong>${scores.ai}</strong></div>
          <div style="display:flex; gap:10px; justify-content:center;">
            <button id="next-round" class="btn primary">الجولة التالية</button>
            <button id="close-modal" class="btn">إغلاق</button>
          </div>
        `;
        backdrop.appendChild(card);
        this.modalRoot.appendChild(backdrop);
        this.modalRoot.setAttribute('aria-hidden', 'false');

        // Handlers
        $('#next-round').addEventListener('click', () => {
          backdrop.remove();
          this.modalRoot.innerHTML = '';
          this.modalRoot.setAttribute('aria-hidden', 'true');
          // Start next round via engine (UI doesn't hold engine ref; engine will attach handler)
          document.dispatchEvent(new CustomEvent('nextRound'));
        });
        $('#close-modal').addEventListener('click', () => {
          backdrop.remove();
          this.modalRoot.innerHTML = '';
          this.modalRoot.setAttribute('aria-hidden', 'true');
        });
      }

      // Match victory modal with confetti
      showMatchVictory(champion, scores) {
        this.modalRoot.innerHTML = '';
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        const card = document.createElement('div');
        card.className = 'modal';
        const title = champion === 'player' ? 'البطل — أنت!' : 'البطل — AI';
        card.innerHTML = `
          <h2 style="color:var(--accent-gold); margin:0 0 8px 0;">${title}</h2>
          <div class="muted" style="margin-bottom:12px;">انتهت المباراة</div>
          <div style="font-weight:900; font-size:20px; margin-bottom:12px; color:var(--accent-gold);">أنت: ${scores.player} • AI: ${scores.ai}</div>
          <div style="display:flex; gap:10px; justify-content:center;">
            <button id="play-again" class="btn primary">العب مرة أخرى</button>
            <button id="close-match" class="btn">إغلاق</button>
          </div>
        `;
        backdrop.appendChild(card);
        this.modalRoot.appendChild(backdrop);
        this.modalRoot.setAttribute('aria-hidden', 'false');

        // Start confetti
        this.startConfetti();

        $('#play-again').addEventListener('click', () => {
          this.stopConfetti();
          backdrop.remove();
          this.modalRoot.innerHTML = '';
          this.modalRoot.setAttribute('aria-hidden', 'true');
          document.dispatchEvent(new CustomEvent('playAgain'));
        });
        $('#close-match').addEventListener('click', () => {
          this.stopConfetti();
          backdrop.remove();
          this.modalRoot.innerHTML = '';
          this.modalRoot.setAttribute('aria-hidden', 'true');
        });
      }

      /* -------------------------
         Confetti (canvas) - lightweight & performant
         ------------------------- */
      startConfetti() {
        const canvas = this.confettiCanvas;
        canvas.style.display = 'block';
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        const pieces = [];
        const colors = ['#ffd166', '#7ef9ff', '#ff7ab6', '#9bffb8', '#ffd1a9'];
        for (let i = 0; i < 80; i++) {
          pieces.push({
            x: Math.random() * canvas.width,
            y: Math.random() * -canvas.height,
            w: 6 + Math.random() * 10,
            h: 6 + Math.random() * 10,
            vx: -2 + Math.random() * 4,
            vy: 2 + Math.random() * 6,
            r: Math.random() * 360,
            vr: -6 + Math.random() * 12,
            color: colors[Math.floor(Math.random() * colors.length)],
            opacity: 0.8 + Math.random() * 0.2
          });
        }
        let raf;
        const loop = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          pieces.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.r += p.vr;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.r * Math.PI / 180);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.opacity;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
            if (p.y > canvas.height + 40) {
              p.y = -40;
              p.x = Math.random() * canvas.width;
            }
          });
          raf = requestAnimationFrame(loop);
        };
        loop();
        // stop after 6s
        setTimeout(() => {
          cancelAnimationFrame(raf);
          canvas.style.display = 'none';
        }, 6000);
      }

      stopConfetti() {
        const canvas = this.confettiCanvas;
        canvas.style.display = 'none';
      }
    }

    /* =========================
       Wiring: instantiate UI & Engine, attach handlers
       ========================= */
    const ui = new UI();
    const engine = new GameEngine(ui);

    // Attach UI callbacks to engine methods
    ui.onTileClick = async (tile) => {
      // Player attempts to play tile
      if (engine.sm.phase !== 'playing' || engine.sm.turn !== 'player') {
        ui.announce('ليس دورك الآن');
        return;
      }
      // Validate playable
      if (!engine.isTilePlayable(tile, 'player')) {
        // If first-move highest double rule applies, show tooltip
        if (engine.state.roundFirstMove && engine.state.highestDouble && engine.state.highestDouble.owner === 'player') {
          ui.showTooltip(`يجب أن تبدأ بأعلى دبل لديك: ${engine.state.highestDouble.tile.id}`);
          return;
        }
        ui.announce('القطعة غير قابلة لللعب');
        return;
      }

      // Determine side automatically: prefer right if both valid
      let side = 'right';
      if (engine.state.train.length > 0) {
        const leftEnd = engine.state.train[0].a;
        const rightEnd = engine.state.train[engine.state.train.length - 1].b;
        const canLeft = tile.a === leftEnd || tile.b === leftEnd;
        const canRight = tile.a === rightEnd || tile.b === rightEnd;
        if (canLeft && !canRight) side = 'left';
        else if (canRight && !canLeft) side = 'right';
        else side = 'right';
      }

      await engine.placeTile(tile, 'player', side);
    };

    ui.onDraw = () => {
      if (engine.sm.phase !== 'playing' || engine.sm.turn !== 'player') {
        ui.announce('لا يمكنك السحب الآن');
        return;
      }
      if (engine.state.boneyard.length === 0) {
        ui.announce('البونيارد فارغ');
        return;
      }
      const tile = engine.draw('player');
      ui.renderHand(engine.state.hands.player);
      // If drawn tile is playable, highlight
      const playable = engine.isTilePlayable(tile, 'player');
      if (playable) ui.announce('سحبت قطعة قابلة للعب');
      else ui.announce('سحبت قطعة غير قابلة للعب');
    };

    ui.onEndTurn = () => {
      engine.endPlayerTurn();
    };

    ui.onResetMatch = () => {
      engine.resetMatch();
    };

    ui.onAIModeChange = (mode) => {
      engine.setAIMode(mode);
      ui.announce(`AI mode: ${mode}`);
    };

    // Listen for custom events from UI modals
    document.addEventListener('nextRound', () => {
      // increment round and start next round with previous winner as starter
      engine.state.round++;
      engine.startRound(false, engine.state.scores.player > engine.state.scores.ai ? 'player' : 'ai');
    });
    document.addEventListener('playAgain', () => {
      engine.startMatch();
    });

    // Start initial match
    engine.startMatch();

    // Expose for debugging (dev only)
    window.__Dominoes = { engine, ui, Tile };

    /* =========================
       Accessibility & keyboard shortcuts
       - 'd' to draw, 'e' to end turn, 'r' to reset
       ========================= */
    window.addEventListener('keydown', (e) => {
      if (e.key === 'd' || e.key === 'D') ui.onDraw();
      if (e.key === 'e' || e.key === 'E') ui.onEndTurn();
      if (e.key === 'r' || e.key === 'R') {
        if (confirm('إعادة المباراة؟')) ui.onResetMatch();
      }
    });

    /* =========================
       Final notes:
       - All animations use transform/opacity to remain performant.
       - Game logic is centralized in GameEngine; UI only renders and forwards user actions.
       - AI is pure logic and can be moved to a Web Worker for heavy computation.
       - To extend: persist match state, add multiplayer via WebSocket, add sound FX.
       ========================= */
  })();
  </script>
